<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8C1428">
<meta name="description" content="Entrenos, partidos, plantilla y progreso de tus equipos de minivoley.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pizarra">
<title>Pizarra de vóley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3EBEC;--surface:#FFFFFF;--surface-2:#FAF3F4;--ink:#26121A;--ink-2:#6A5057;--line:#E5D1D5;
  --court:#8C1428;--court-ink:#7A1022;--court-soft:#F4DCE0;--on-court:#FFFFFF;
  --ball:#FFC72C;--ball-edge:#D9A300;--ball-soft:#FFF1C6;--ball-ink:#5A4000;
  --ok:#157F55;--ok-soft:#DAF2E7;--mid:#8F6000;--mid-soft:#FFF1C6;--bad:#B42318;--bad-soft:#FBE0DC;
  --violet:#5741C4;--violet-soft:#E7E2FA;--teal:#0B7F92;--pink:#C24A82;--blue:#2F63C9;--orange:#D9652B;--on-strong:#FFFFFF;--lime:#5E8F14;
  --shadow:0 1px 2px rgba(43,21,25,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140A0D;--surface:#211116;--surface-2:#29161C;--ink:#F7E8EA;--ink-2:#C7A9AE;--line:#44262D;
  --court:#A51A30;--court-ink:#FF8F9D;--court-soft:#3D1119;--on-court:#FFFFFF;
  --ball:#FFC72C;--ball-edge:#D9A300;--ball-soft:#3A2F10;--ball-ink:#FFE08A;
  --ok:#52C995;--ok-soft:#113828;--mid:#F2BE45;--mid-soft:#3A2E10;--bad:#F37D76;--bad-soft:#3E1A1B;
  --violet:#AD9CFF;--violet-soft:#282050;--teal:#4FC3D4;--pink:#EE8DBA;--blue:#8FB0FF;--orange:#FF9A5C;--on-strong:#170C0F;--lime:#A6D45A;
  --shadow:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#140A0D;--surface:#211116;--surface-2:#29161C;--ink:#F7E8EA;--ink-2:#C7A9AE;--line:#44262D;
  --court:#A51A30;--court-ink:#FF8F9D;--court-soft:#3D1119;--on-court:#FFFFFF;
  --ball:#FFC72C;--ball-edge:#D9A300;--ball-soft:#3A2F10;--ball-ink:#FFE08A;
  --ok:#52C995;--ok-soft:#113828;--mid:#F2BE45;--mid-soft:#3A2E10;--bad:#F37D76;--bad-soft:#3E1A1B;
  --violet:#AD9CFF;--violet-soft:#282050;--teal:#4FC3D4;--pink:#EE8DBA;--blue:#8FB0FF;--orange:#FF9A5C;--on-strong:#170C0F;--lime:#A6D45A;
  --shadow:none;color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--court);z-index:30;pointer-events:none}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
a{color:var(--court-ink)}
img,svg{max-width:100%}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.grow{flex:1;min-width:0}

/* Layout */
#app{display:flex;flex-direction:column}
#main{flex:1;min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{background:none;border:0;padding:8px 1px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2);min-width:0}
#nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav button svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--court-ink)}
#nav button[aria-current="page"] svg{color:var(--court)}
#nav .brand{display:none}
#nav .brand svg{width:40px;height:40px;flex:none}
@media(min-width:900px){
  #app{flex-direction:row}
  #nav{position:sticky;top:0;align-self:flex-start;width:228px;height:100vh;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:18px 12px;gap:2px}
  #nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px}
  #nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px;border-radius:10px}
  #nav button:hover{background:var(--surface-2)}
  #nav button[aria-current="page"]{background:var(--court-soft)}
  #main{padding-bottom:48px}
}

/* Header: a strip of court */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;min-height:58px;padding:9px 14px 9px 16px;background-color:var(--court);color:var(--on-court);border-bottom:3px solid #fff;
  background-image:linear-gradient(90deg,transparent calc(100% - 118px),rgba(255,255,255,.28) calc(100% - 118px),rgba(255,255,255,.28) calc(100% - 116px),transparent calc(100% - 116px))}
.bar h1{flex:1;min-width:0;font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.big h1{font-size:27px}
.icon-btn{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:inherit}
.icon-btn svg{width:22px;height:22px}
.icon-btn.soft{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.icon-btn.tiny{width:32px;height:32px}
.icon-btn.tiny svg{width:17px;height:17px}
.hbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;color:#7A1022;font-weight:800;padding:8px 14px 8px 11px;font-size:15px;box-shadow:inset 0 -2px 0 rgba(43,21,25,.14)}
.hlogo{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;margin-left:-4px}
.hlogo svg{width:38px;height:38px}
.hbtn svg{width:19px;height:19px}

.page{padding:16px 16px 8px;max-width:780px;margin:0 auto}
.sec{margin-top:26px}
.sec>h2,.sec-h{font-size:20px;font-weight:800;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.count{font-family:'Figtree',sans-serif;font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.sec>p.muted{margin:-4px 0 10px}
.banner{background:var(--bad-soft);color:var(--bad);padding:10px 16px;font-weight:600}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;line-height:1.2}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.btn.ball{background:var(--ball);border-color:var(--ball-edge);color:#3A2A00}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btnrow.end{justify-content:flex-end;margin-top:30px}
.btnrow .btn{flex:0 1 auto}
.linklike{background:none;border:0;padding:0;color:var(--court-ink);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:700;color:var(--ink-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(19,32,59,.16)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;margin:12px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.flag-up[aria-pressed="true"],.chip.violet[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-strong)}
.chip.flag-re[aria-pressed="true"],.chip.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.chip.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-strong)}
.chip.person{padding:7px 12px}
.chip small{font-weight:600;opacity:.75}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.field>span{font-size:14px;font-weight:700;color:var(--ink-2)}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--court);outline:none;box-shadow:0 0 0 3px var(--court-soft)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fh{font-size:17px;font-weight:800;margin:10px 0 8px;display:flex;gap:8px;align-items:baseline}

/* Cards and lists */
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;color:var(--ink);box-shadow:var(--shadow)}
button.card:hover{border-color:var(--court)}
.card .t{display:block;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.card .sub{display:block;font-size:14px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:14.5px}
.datebox{flex:none;width:48px;height:52px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--court-soft);color:var(--court-ink);line-height:1}
.datebox b{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800}
.datebox small{font-size:12.5px;font-weight:700;margin-top:3px}
.datebox.mt{background:var(--ball-soft);color:var(--ball-ink)}
.tag{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);line-height:1.2;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.mid{background:var(--mid-soft);color:var(--mid);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.violet{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.tag.court{background:var(--court-soft);color:var(--court-ink);border-color:transparent}
.rdots{display:inline-flex;gap:8px;align-items:center;font-weight:700}
.rdots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:0}
.rdots .ok{background:var(--ok)}.rdots .mid{background:var(--ball)}.rdots .bad{background:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2);background:var(--surface);border:1.5px dashed var(--line);border-radius:14px}
.empty .btn{margin-top:12px}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--court-soft);color:var(--court-ink)}
.avatar.coach{background:var(--court);color:#fff}
.avatar.c2{background:var(--ball-soft);color:var(--ball-ink)}.avatar.c3{background:var(--ok-soft);color:var(--ok)}.avatar.c4{background:var(--violet-soft);color:var(--violet)}.avatar.c5{background:var(--bad-soft);color:var(--bad)}.avatar.c6{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)}
.att{flex:none;text-align:right;font-weight:800;font-size:15px}
.att small{display:block;font-weight:600;font-size:12px;color:var(--ink-2)}
.catmark{flex:none;width:6px;align-self:stretch;min-height:36px;border-radius:4px;background:var(--ink-2)}
.c-calentamiento{background:var(--orange)}.c-activacion{background:var(--lime)}.c-dedos{background:var(--blue)}.c-antebrazos{background:var(--ok)}.c-saque{background:var(--ball)}.c-ataque{background:var(--violet)}.c-defensa{background:var(--teal)}.c-coordinacion{background:var(--pink)}.c-juego{background:var(--ink-2)}
.group-h{font-size:15px;font-weight:800;color:var(--ink-2);margin:20px 0 8px;font-family:'Figtree',sans-serif;display:flex;gap:8px}

/* Calendar */
.calhead{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.calhead h2{flex:1;font-size:22px;font-weight:800;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12.5px;font-weight:800;color:var(--ink-2);padding:2px 0 4px}
.day{min-height:52px;border:1.5px solid transparent;border-radius:11px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 5px;gap:5px;color:var(--ink)}
.day.blank{background:transparent}
.day .dn{font-weight:700;font-size:15px;line-height:24px;min-width:26px;border-radius:999px;text-align:center}
.day.today .dn{background:var(--ink);color:var(--surface)}
.day[aria-pressed="true"]{border-color:var(--court);background:var(--court-soft)}
.day.wknd{background:var(--surface-2)}
.day.wknd[aria-pressed="true"]{background:var(--court-soft)}
.mks{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:36px}
.mk{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.mk.tr{border:2px solid var(--court)}
.mk.tr.done{background:var(--court)}
.mk.mt{background:var(--ball);box-shadow:inset 0 0 0 1.5px var(--ball-edge)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.welcome{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--court);border-radius:14px;padding:16px}
.welcome h2{font-size:19px;margin-bottom:8px}
.welcome ol{margin:0;padding-left:22px;display:grid;gap:6px}

/* Session detail */
.hero-info{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero-info h2{font-size:24px;font-weight:800}
.hero-info .sub{margin-top:4px}
.hero-info .obj{margin:12px 0 0;padding:10px 12px;background:var(--court-soft);color:var(--ink);border-radius:10px;font-weight:600}
.hero-info .btn{margin-top:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item-top{display:flex;gap:10px;align-items:flex-start}
.item h3{font-size:17px;font-weight:800;font-family:'Figtree',sans-serif;letter-spacing:0}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--court-soft);color:var(--court-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.rgroup{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 8px}
.rbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-weight:700;font-size:14.5px;color:var(--ink-2)}
.rbtn.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-strong)}
.rbtn.mid[aria-pressed="true"]{background:var(--ball);border-color:var(--ball-edge);color:#3A2A00}
.rbtn.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.flags{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;margin-top:10px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note .src{font-size:13px;color:var(--ink-2)}
.note .src .linklike{font-size:13px}
.note-list{display:flex;flex-direction:column;gap:8px}

/* Match */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--court);color:#fff;border-radius:16px;padding:14px 16px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.score div{text-align:center;min-width:0}
.score div span{display:block;font-weight:700;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score b{font-family:'Bricolage Grotesque',sans-serif;font-size:44px;font-weight:800;line-height:1}
.score .vs{font-size:13px;font-weight:700;opacity:.85}
.setgrid{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:8px 8px;align-items:center}
.setgrid .hd{font-size:13px;font-weight:700;color:var(--ink-2);text-align:center}
.setname{font-weight:800;font-size:15px;white-space:nowrap}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-width:0}
.stepper button{flex:none;width:38px;height:42px;border:0;background:var(--surface-2);font-size:20px;font-weight:800;color:var(--ink)}
.stepper input{border:0;border-radius:0;text-align:center;padding:8px 0;font-weight:800;font-size:18px;background:transparent;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{box-shadow:none}
.dash{color:var(--ink-2);font-weight:700}
.net{height:14px;border-radius:4px 4px 0 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 1.5px,transparent 1.5px 9px),var(--ink);position:relative}
.court{background:var(--court);border:3px solid #fff;border-top:0;border-radius:0 0 16px 16px;padding:16px 12px 18px;display:grid;gap:14px;box-shadow:0 0 0 1px var(--line)}
.crow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.aline{height:0;border-top:2px solid rgba(255,255,255,.75);margin:0 -12px}
.slot{border:0;background:#fff;color:#13203B;border-radius:14px;padding:8px 4px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:14.5px;min-width:0}
.slot .pos{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ball);color:#3A2A00;font-size:12.5px;box-shadow:inset 0 0 0 1.5px var(--ball-edge)}
.slot .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.slot.empty{background:rgba(255,255,255,.14);color:#fff;border:2px dashed rgba(255,255,255,.75)}
.slot.picking{outline:4px solid var(--ball);outline-offset:1px}
.slot.serve{box-shadow:0 0 0 3px var(--ball)}
.slot:disabled{opacity:1}
.slotpick{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.slotpick p{margin-bottom:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:10px}

/* Exercises */
.exhead{display:flex;flex-wrap:wrap;gap:6px}
.fun{margin-top:12px;background:var(--ball-soft);color:var(--ball-ink);border-radius:12px;padding:10px 12px;font-weight:600}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vlinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vlink{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.vlink svg{width:18px;height:18px;color:var(--bad)}
.hist{display:flex;gap:10px;align-items:flex-start}
.picker{margin-top:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px}
.picker .chips.scroll{margin:10px -12px 0;padding-left:12px;padding-right:12px}
.picker-list{max-height:260px;overflow:auto;margin-top:6px;display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;text-align:left;color:var(--ink)}
.pick:last-child{border-bottom:0}
.pick small{display:block;color:var(--ink-2);font-size:13px}
.pick svg{width:20px;height:20px;color:var(--court)}
.pick .catmark{min-height:30px}
.quick{display:flex;gap:8px;margin-top:10px}
.quick input{flex:1}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.pitem .grow{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pitem .mins{width:62px;padding:7px 6px;text-align:center}
.pitem .unit{font-size:13px;color:var(--ink-2)}
.repeat{margin-top:18px;display:grid;gap:10px;justify-items:start}
.repeat .field{width:100%;margin:0}

/* Ideas */
.idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.idea-head{display:flex;gap:10px;align-items:stretch}
.idea h3{font-size:19px;font-weight:800}
.idea dl{margin:12px 0 0;display:grid;gap:8px}
.idea dt{font-size:13.5px;font-weight:800;color:var(--ink-2)}
.idea dd{margin:0;overflow-wrap:anywhere}
.idea .vlinks{margin-top:12px}
.thinking{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel .fh:first-child{margin-top:0}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:13.5px;color:var(--ink-2);font-weight:600}
.aicard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--court);border-radius:16px;padding:16px}
.aicard>h2{margin-bottom:4px}
.aicard>p.muted{margin:0 0 12px}
.summary{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.summary h3{font-size:16px;font-weight:800;margin:16px 0 6px;font-family:'Figtree',sans-serif;letter-spacing:0}
.summary .lead{font-size:17px;font-weight:600;margin-top:6px}
.summary ul{margin:0;padding-left:20px;display:grid;gap:4px}
.imp{border-left:4px solid var(--bad);padding:4px 0 4px 12px;margin-bottom:10px}
.imp p{margin-top:3px;color:var(--ink-2)}
.imp .lbl{font-weight:700;color:var(--ink)}
.kid{margin-bottom:6px}
.sbar{display:grid;grid-template-columns:minmax(90px,130px) 1fr 38px;gap:10px;align-items:center;margin-bottom:8px;font-size:14.5px}
.track{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ball);border-right:2px solid var(--ball-edge)}
.sbar.low .track i{background:var(--bad);border-color:var(--bad)}
.arow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.arow:last-child{border-bottom:0}

/* Player skills */
.skill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill>span{font-weight:600}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0}
.dots button.on{background:var(--ball);border-color:var(--ball-edge);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 3px,transparent 4px)}


/* Rutinas, equipos, imágenes y resumen */
.step{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .grow{overflow-wrap:anywhere}
.panel.steps{padding:6px 14px}
.pitem input:not(.mins){flex:1;min-width:0;padding:8px 10px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.team{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;min-width:0}
.team-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.team-h .btn{margin-left:auto}
.tdot{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.eximg{display:block;width:100%;max-width:560px;border-radius:14px;border:1px solid var(--line);background:#FBF3F4;overflow:hidden}
.eximg.dg svg{display:block;width:100%;height:auto}
img.eximg{object-fit:cover;aspect-ratio:5/3}
.exp-box{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:14px}
.exp-box img{display:block;width:100%}
.block-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,15,32,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;font-size:20px;font-weight:800}
.sheet-body{overflow:auto;padding:16px 16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
.sheet-foot .grow{flex:1}
@media(min-width:700px){.sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(600px,calc(100% - 40px));max-height:calc(100% - 60px);border-radius:20px}.sheet.enter{animation:fade .18s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--surface);padding:11px 14px 11px 16px;border-radius:12px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:var(--ball);color:#3A2A00;font-weight:800;border-radius:8px;padding:6px 10px}
@media(min-width:900px){#toast{bottom:28px}}

.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;color:var(--ink-2);font-weight:600}
.ld-ball svg{width:46px;height:46px;animation:bounce .9s ease-in-out infinite alternate}
.ld-ball.small svg{width:30px;height:30px}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-14px) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  {id: 'ataque', name: 'Ataque'}, {id: 'defensa', name: 'Defensa'}, {id: 'actitud', name: 'Actitud y equipo'},

const PERIODS = {'30': 'últimos 30 días', '90': 'últimos 3 meses', season: 'esta temporada', all: 'todo el historial'};

/* ================= Iconos ================= */
const svg = p => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

};
const BALL = `<svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#FFFFFF" stroke="#2B1519" stroke-width="2"/><g transform="translate(16 16) scale(1.5) translate(-12 -12)" fill="none" stroke="#8C1428" stroke-width="1.4" stroke-linecap="round"><path d="M12 12a8 8 0 0 0 8 4"/><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5"/><g transform="rotate(120 12 12)"><path d="M12 12a8 8 0 0 0 8 4"/><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5"/></g><g transform="rotate(240 12 12)"><path d="M12 12a8 8 0 0 0 8 4"/><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5"/></g></g></svg>`;

const LOGO = `<svg viewBox="0 0 100 100" width="40" height="40" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#26121A"/><path d="M14 25h72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 5.5"/><circle cx="26.0" cy="45.0" r="8.5" fill="#8C1428"/><circle cx="50.0" cy="45.0" r="8.5" fill="#8C1428"/><circle cx="74.0" cy="45.0" r="8.5" fill="#8C1428"/><circle cx="26.0" cy="69.0" r="8.5" fill="#8C1428"/><circle cx="50.0" cy="69.0" r="8.5" fill="#8C1428"/><circle cx="74.0" cy="69.0" r="10" fill="#FFC72C"/><g transform="translate(74.0 69.0) scale(1.111) translate(-12 -12)" fill="none" stroke="#26121A" stroke-width="1.62" stroke-linecap="round"><path d="M12 12a8 8 0 0 0 8 4"/><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5"/><g transform="rotate(120 12 12)"><path d="M12 12a8 8 0 0 0 8 4"/><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5"/></g><g transform="rotate(240 12 12)"><path d="M12 12a8 8 0 0 0 8 4"/><path d="M7.5 13.5a12 12 0 0 0 8.5 6.5"/></g></g></svg>`;

/* ================= Datos ================= */
const S = {players: {}, coaches: {}, exercises: {}, routines: {}, sessions: {}, matches: {}, meta: {}};
const COLS = Object.keys(S);
const LSKEY = 'libreta-voley-v1';
let loaded = false;
let bannerMsg = '';

const Store = {
  mode: 'loading', base: null,
  dirty: new Set(), writing: new Set(), again: new Set(), timers: {}, active: 0, waiters: [],
  async init() {
    let db = null, user = null, id = null;
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) {}
      if (db && user) { try { id = await user.id(); } catch (e) {} }
    }
    if (db && id) {
      this.mode = 'db';
      this.base = db.doc('data/users/' + id + '/app');
      this.subscribe();
    } else {
      this.mode = 'local';
      this.loadLocal();
      ready();
    }
  },
  loadLocal() {
    try {
      const raw = localStorage.getItem(LSKEY);
      if (raw) { const d = JSON.parse(raw); COLS.forEach(c => { if (d[c] && typeof d[c] === 'object') S[c] = d[c]; }); }
    } catch (e) {}
  },
  saveLocal() {
    clearTimeout(this.lt);
    this.lt = setTimeout(() => { try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) { toast('No se ha podido guardar en este navegador.'); } }, 200);
  },
  subscribe() {
    const waiting = new Set(COLS);
    const done = col => { if (waiting.has(col)) { waiting.delete(col); if (!waiting.size) ready(); return true; } return false; };
    setTimeout(() => { if (!loaded) ready(); }, 12000);
    COLS.forEach(col => {
      this.base.collection(col).onSnapshot(snap => {
        const cur = S[col], out = {}, seen = new Set();
        let changed = false;
        snap.docs.forEach(d => {
          seen.add(d.id);
          if (this.dirty.has(col + '/' + d.id)) { if (cur[d.id]) out[d.id] = cur[d.id]; return; }

          if (seen.has(id)) return;
          if (this.dirty.has(col + '/' + id)) out[id] = cur[id]; else changed = true;

        if (!done(col) && changed) render();
      }, () => {

  save(col, obj) { S[col][obj.id] = obj; this.persist(col, obj.id); },
  remove(col, id) { delete S[col][id]; this.persist(col, id); },

const DIAGRAM_RULES = `Coordenadas: la pista completa va de x=0 (izquierda) a x=100 (derecha) y de y=0 (arriba) a y=60 (abajo). La red está en x=50. Si el ejercicio no usa red (un corro, un relevo), pon "red": false.
Formato del dibujo: {"red":true,"elementos":[...]} con elementos de estos tipos:
{"t":"jugador","x":30,"y":20,"equipo":"a","texto":"1"} (equipo "a", "b" o "c"; texto opcional de 1 o 2 caracteres)
{"t":"entrenador","x":45,"y":30}
{"t":"cono","x":20,"y":10}
{"t":"aro","x":80,"y":15}
{"t":"balon","x":32,"y":18}
{"t":"zona","x":60,"y":5,"w":20,"h":15} (una zona objetivo; x e y son su esquina de arriba a la izquierda)
{"t":"flecha","x1":30,"y1":20,"x2":70,"y2":30,"tipo":"pase"} (tipo "pase" = trayectoria del balón, "carrera" = desplazamiento de un jugador, "golpe" = saque o remate)
Usa entre 5 y 30 elementos. Dibuja solo lo esencial: dónde se colocan, por dónde va el balón y hacia dónde se mueven. Si hay muchos niños, dibuja un grupo representativo.`;
function normDiagram(d) {

  const T = ['jugador', 'entrenador', 'cono', 'aro', 'balon', 'zona', 'flecha'];
  const els = [];
  d.elementos.slice(0, 40).forEach(e => {
    if (!e || !T.includes(e.t)) return;
    if (e.t === 'flecha') {
      const o = {t: 'flecha', x1: num(e.x1, 0, 100), y1: num(e.y1, 0, 60), x2: num(e.x2, 0, 100), y2: num(e.y2, 0, 60), tipo: ['pase', 'carrera', 'golpe'].includes(e.tipo) ? e.tipo : 'pase'};
      if ([o.x1, o.y1, o.x2, o.y2].every(v => v != null)) els.push(o);
      return;
    }
    const o = {t: e.t, x: num(e.x, 0, 100), y: num(e.y, 0, 60)};
    if (o.x == null || o.y == null) return;
    if (e.t === 'zona') { o.w = num(e.w, 2, 100) || 10; o.h = num(e.h, 2, 60) || 10; }

}

    ...Object.values(S.sessions).filter(s => s.status !== 'hecho' && s.date >= t && (!ui.group || s.group === ui.group)).map(s => ({o: s, h: () => sessionCard(s)})),
    ...Object.values(S.matches).filter(m => m.date >= t && (!ui.group || m.group === ui.group)).map(m => ({o: m, h: () => matchCard(m)})),
  ].sort((a, b) => byDateAsc(a.o, b.o)).slice(0, 5);
  const fresh = !Object.keys(S.players).length && !Object.keys(S.sessions).length && !Object.keys(S.matches).length;
  return header('Calendario', {big: true}) + `<div class="page">
    ${fresh ? `<section class="welcome"><h2>Tu pizarra está lista</h2><ol>
      <li><button class="linklike" data-act="tab" data-tab="players">Añade a tu plantilla</button> por grupos y cursos, y a tu <button class="linklike" data-act="go-coaches">cuerpo técnico</button>.</li>
      <li><button class="linklike" data-act="tab" data-tab="exercises">Repasa tus ejercicios</button> o pide ideas nuevas.</li>
      <li>Toca un día del calendario y planifica el primer entreno o partido.</li></ol></section>` : ''}
    ${groupChips()}
    <div class="calhead"><button class="icon-btn soft" data-act="calmove" data-d="-1" aria-label="Mes anterior">${ic.left}</button><h2>${esc(title)}</h2><button class="icon-btn soft" data-act="calmove" data-d="1" aria-label="Mes siguiente">${ic.right}</button></div>
    <div class="cal">${g}</div>
    <div class="legend"><span><i class="mk tr"></i>Entreno planificado</span><span><i class="mk tr done"></i>Entreno hecho</span><span><i class="mk mt"></i>Partido</span>${(c.y !== now.getFullYear() || c.m !== now.getMonth()) ? '<button class="linklike" data-act="caltoday">Volver a hoy</button>' : ''}</div>
    <section class="sec"><h2>${esc(fLong(c.sel))}</h2>
      ${selList.length ? `<div class="list">${selList.join('')}</div>` : '<p class="muted">Nada apuntado este día.</p>'}
      <div class="btnrow"><button class="btn primary" data-act="new-session" data-date="${c.sel}">${ic.plus}Planificar entreno</button><button class="btn ball" data-act="new-match" data-date="${c.sel}">${ic.plus}Añadir partido</button></div>
    </section>
    <section class="sec"><h2>Lo próximo</h2>${upcoming.length ? `<div class="list">${upcoming.map(x => x.h()).join('')}</div>` : '<p class="muted">No hay nada planificado a partir de hoy.</p>'}</section>
  </div>`;
}

/* ================= Entrenos ================= */
function vSessions() {
  const t = todayStr();
  const all = Object.values(S.sessions).filter(s => !ui.group || s.group === ui.group);
  const pend = all.filter(s => s.status !== 'hecho' && s.date < t).sort(byDateDesc);
  const next = all.filter(s => s.status !== 'hecho' && s.date >= t).sort(byDateAsc);
  const done = all.filter(s => s.status === 'hecho').sort(byDateDesc);
  let body = '';
  if (ui.sessTab === 'next') {
    if (pend.length) body += `<section class="sec"><h2>Sin evaluar <span class="count">${pend.length}</span></h2><p class="muted">Ya han pasado: apunta cómo fueron y márcalos como hechos.</p><div class="list">${pend.map(sessionCard).join('')}</div></section>`;
    body += `<section class="sec"><h2>Próximos</h2>${next.length ? `<div class="list">${next.map(sessionCard).join('')}</div>` : empty('No hay entrenos planificados.', `<button class="btn primary" data-act="new-session">${ic.plus}Planificar entreno</button>`)}</section>`;
  } else {
    body += `<section class="sec">${done.length ? `<div class="list">${done.map(sessionCard).join('')}</div>` : empty('Todavía no hay entrenos hechos. Cuando evalúes uno y lo marques como hecho, aparecerá aquí.')}</section>`;
  }
  return header('Entrenos', {big: true, action: hbtn('new-session', 'Planificar')}) + `<div class="page">${seg([['next', 'Próximos'], ['done', 'Historial']], ui.sessTab, 'sess-tab')}${groupChips()}${body}</div>`;
}

function itemBlock(s, it, i, num) {
  const ex = it.exerciseId && S.exercises[it.exerciseId];
  const cat = ex && CATS[ex.category];
  const title = ex ? `<button class="linklike" data-act="open" data-view="exercise" data-id="${ex.id}">${esc(it.name || ex.name)}</button>` : esc(it.name);
  return `<article class="item">
    <div class="item-top"><span class="num" aria-hidden="true">${num || i + 1}</span><div class="grow"><h3>${title}</h3><p class="sub">${esc([cat && cat.name, it.minutes ? it.minutes + ' min' : ''].filter(Boolean).join(', '))}</p></div></div>
    <div class="rgroup" role="group" aria-label="Cómo salió">${Object.entries(RESULTS).map(([k, r]) => `<button class="rbtn ${r.cls}" data-act="eval" data-id="${s.id}" data-i="${i}" data-v="${k}" aria-pressed="${it.result === k}">${r.name}</button>`).join('')}</div>
    <div class="flags"><button class="chip flag-up" data-act="flag" data-id="${s.id}" data-i="${i}" data-flag="levelUp" aria-pressed="${!!it.levelUp}">Subir nivel</button><button class="chip flag-re" data-act="flag" data-id="${s.id}" data-i="${i}" data-flag="rethink" aria-pressed="${!!it.rethink}">Replantear</button></div>
    <textarea id="in-${s.id}-${i}" data-bind="item-note" data-id="${s.id}" data-i="${i}" rows="2" aria-label="Nota sobre ${esc(it.name)}" placeholder="Qué ha pasado, qué cambiarías">${esc(it.note)}</textarea>
  </article>`;
}

function stepsPanel(block, title, emptyText) {
  if (!block) return `<section class="sec"><h2>${title}</h2><p class="muted">${emptyText}</p></section>`;
  const m = routineMinutes(block);
  return `<section class="sec"><h2>${title} <span class="count">${esc(block.name)}${m ? ', ' + m + ' min' : ''}</span></h2><div class="panel steps">${(block.steps || []).map((st, i) => `<div class="step"><span class="num" aria-hidden="true">${i + 1}</span><span class="grow">${esc(st.name)}</span>${st.minutes ? `<span class="muted">${st.minutes} min</span>` : ''}</div>`).join('') || '<p class="muted" style="padding:8px 0">La rutina no tiene pasos.</p>'}</div></section>`;
}
function teamsHtml(s, exp) {
  const expSet = new Set(exp);
  const teams = (s.teams || []).map(t => Object.assign({}, t, {members: (t.members || []).filter(id => expSet.has(id) && S.players[id])}));
  const assigned = new Set(teams.flatMap(t => t.members));
  const loose = exp.filter(id => !assigned.has(id));
  const pick = ui.teamPick && expSet.has(ui.teamPick) ? ui.teamPick : '';
  const countSeg = `<div class="field" style="margin:12px 0 0"><span>Número de grupos</span>${seg([2, 3, 4, 5, 6].map(n => [String(n), String(n)]), String(ui.teamCount), 'team-count')}</div>`;
  if (!teams.length) return `<p class="muted">Divide a quienes vienen en grupos para los ejercicios.</p>${countSeg}<div class="btnrow"><button class="btn primary" data-act="team-random" data-id="${s.id}" ${exp.length < 2 ? 'disabled' : ''}>Repartir al azar</button><button class="btn" data-act="team-balance" data-id="${s.id}" ${exp.length < 2 ? 'disabled' : ''}>Equilibrar por nivel</button></div>`;
  const card = (t, idx) => `<div class="team"><div class="team-h"><span class="tdot" style="background:${esc(t.color)}" aria-hidden="true"></span><b>${esc(t.name)}</b><span class="count">${t.members.length}</span>${pick && !t.members.includes(pick) ? `<button class="btn small" data-act="team-move" data-id="${s.id}" data-t="${idx}">Mover aquí</button>` : ''}</div><div class="chips">${t.members.map(pid => `<button class="chip person" data-act="team-pick" data-p="${pid}" aria-pressed="${pick === pid}">${esc(S.players[pid].name)}</button>`).join('') || '<span class="muted small">Nadie todavía</span>'}</div></div>`;
  return `<p class="muted small">${pick ? `Ahora toca «Mover aquí» en el grupo al que quieres pasar a ${esc(firstName(S.players[pick].name))}.` : 'Toca un nombre para cambiarle de grupo.'}</p>
    <div class="teams">${teams.map(card).join('')}${loose.length ? card({name: 'Sin grupo', color: '#A89A9D', members: loose}, -1) : ''}</div>
    ${countSeg}
    <div class="btnrow"><button class="btn" data-act="team-random" data-id="${s.id}">Repartir otra vez</button><button class="btn" data-act="team-balance" data-id="${s.id}">Equilibrar por nivel</button><button class="btn danger" data-act="team-clear" data-id="${s.id}">Quitar grupos</button></div>`;
}
function vSession({id}) {
  const s = S.sessions[id];
  if (!s) return null;
  const items = (s.items || []).map((it, i) => ({it, i}));
  const act = items.filter(x => x.it.block === 'activacion');
  const main = items.filter(x => x.it.block !== 'activacion');
  const pool = playersFor(s.group);
  const others = allPlayers().filter(p => !pool.includes(p));
  const exp = expectedOf(s), expSet = new Set(exp);
  const att = new Set(s.attendance || []);
  const mins = sessionMinutes(s);
  const done = s.status === 'hecho';
  const present = allPlayers().filter(p => att.has(p.id)).length;
  const expChip = p => `<button class="chip person" data-act="exp-toggle" data-id="${id}" data-p="${p.id}" aria-pressed="${expSet.has(p.id)}">${esc(p.name)}</button>`;
  const actMins = act.reduce((a, x) => a + (+x.it.minutes || 0), 0), mainMins = main.reduce((a, x) => a + (+x.it.minutes || 0), 0);
  return header('Entreno', {back: true, action: `<button class="hbtn" data-act="edit-session" data-id="${id}"><span>Editar</span></button>`}) + `<div class="page">
    <div class="hero-info">
      <h2>${esc(fLong(s.date))}</h2>
      <p class="sub">${esc([s.time, mins ? mins + ' min' : (s.duration ? s.duration + ' min' : ''), s.group, s.place].filter(Boolean).join(', ')) || 'Sin hora ni grupo'}</p>
      ${s.objective ? `<p class="obj">${esc(s.objective)}</p>` : ''}
      <button class="btn ${done ? 'ok' : 'primary'} block" data-act="toggle-done" data-id="${id}" aria-pressed="${done}">${done ? ic.check + 'Entreno hecho' : 'Marcar como hecho'}</button>
      <button class="btn block" style="margin-top:8px" data-act="export" data-id="${id}">Descargar resumen (imagen o PDF)</button>
    </div>
    ${coachSection('sessions', s, 'Entrenadores')}
    <section class="sec"><h2>Quién viene <span class="count">${allPlayers().length ? `${exp.length} de ${pool.length}` : ''}</span></h2>
      ${allPlayers().length ? `<div class="chips">${pool.map(expChip).join('')}</div>
        ${others.length && pool.length !== allPlayers().length ? `<details><summary>Otros grupos</summary><div class="chips">${others.map(expChip).join('')}</div></details>` : ''}
        <div class="btnrow"><button class="btn small" data-act="exp-all" data-id="${id}">Todo el grupo</button><button class="btn small" data-act="exp-none" data-id="${id}">Nadie</button></div>`
      : empty('Añade a tu plantilla para saber con quién cuentas.', `<button class="btn small" data-act="tab" data-tab="players">Ir a la plantilla</button>`)}
    </section>
    ${allPlayers().length ? `<section class="sec"><h2>Grupos de trabajo</h2>${teamsHtml(s, exp)}</section>` : ''}
    ${stepsPanel(s.warmup, 'Calentamiento', 'Sin calentamiento. Puedes añadirlo desde Editar.')}
    ${act.length ? `<section class="sec"><h2>Juegos de activación <span class="count">${actMins ? actMins + ' min' : ''}</span></h2>${act.map((x, k) => itemBlock(s, x.it, x.i, k + 1)).join('')}</section>` : ''}
    <section class="sec"><h2>Parte principal <span class="count">${mainMins ? mainMins + ' min' : ''}</span></h2>
      ${main.length ? main.map((x, k) => itemBlock(s, x.it, x.i, k + 1)).join('') : empty('Todavía no hay ejercicios en la parte principal.', `<button class="btn small" data-act="edit-session" data-id="${id}">Añadir ejercicios</button>`)}
    </section>
    ${stepsPanel(s.stretch, 'Estiramientos', 'Sin estiramientos. Puedes añadirlos desde Editar.')}
    <section class="sec"><h2>Asistencia <span class="count">${allPlayers().length ? `${present} han venido` : ''}</span></h2>
      ${allPlayers().length ? `<div class="chips">${pool.map(p => `<button class="chip person" data-act="att" data-id="${id}" data-p="${p.id}" aria-pressed="${att.has(p.id)}">${esc(p.name)}</button>`).join('')}</div>
      ${others.length && pool.length !== allPlayers().length ? `<details><summary>Otros grupos</summary><div class="chips">${others.map(p => `<button class="chip person" data-act="att" data-id="${id}" data-p="${p.id}" aria-pressed="${att.has(p.id)}">${esc(p.name)}</button>`).join('')}</div></details>` : ''}
      <div class="btnrow"><button class="btn small" data-act="att-expected" data-id="${id}">Marcar a los previstos</button><button class="btn small" data-act="att-none" data-id="${id}">Quitar todo</button></div>`
      : empty('Añade a tu plantilla para pasar lista.', `<button class="btn small" data-act="tab" data-tab="players">Ir a la plantilla</button>`)}
    </section>
    <section class="sec"><h2>Notas individuales</h2>${pnList('sessions', s)}${pnComposer('sessions', s, pool)}</section>
    <section class="sec"><h2>Notas generales</h2><textarea id="sn-${id}" data-bind="s-notes" data-id="${id}" rows="3" aria-label="Notas generales" placeholder="Cómo estaba el grupo, qué funcionó, qué cambiar la próxima vez">${esc(s.notes)}</textarea></section>
    <div class="btnrow end"><button class="btn" data-act="dup-session" data-id="${id}">Duplicar para otro día</button><button class="btn danger" data-act="del" data-kind="sessions" data-id="${id}">Borrar entreno</button></div>
  </div>`;
}

/* ================= Partidos ================= */
function vMatches() {
  const t = todayStr();
  const all = Object.values(S.matches).filter(m => !ui.group || m.group === ui.group);
  const next = all.filter(m => m.date >= t).sort(byDateAsc);
  const played = all.filter(m => m.date < t).sort(byDateDesc);
  let body;
  if (ui.matchTab === 'next') {
    body = next.length ? `<div class="list">${next.map(matchCard).join('')}</div>` : empty('No hay partidos a la vista.', `<button class="btn ball" data-act="new-match">${ic.plus}Añadir partido</button>`);
  } else {
    const rs = played.map(matchResult).filter(Boolean);
    const w = rs.filter(r => r.res === 'win').length, l = rs.filter(r => r.res === 'loss').length, d = rs.filter(r => r.res === 'draw').length;
    body = played.length ? `${rs.length ? `<p class="muted" style="margin-bottom:10px">${plural(w, 'ganado', 'ganados')}, ${plural(l, 'perdido', 'perdidos')}${d ? ', ' + plural(d, 'empate', 'empates') : ''}</p>` : ''}<div class="list">${played.map(matchCard).join('')}</div>` : empty('Aún no hay partidos jugados.');
  }
  return header('Partidos', {big: true, action: hbtn('new-match', 'Añadir')}) + `<div class="page">${seg([['next', 'Próximos'], ['played', 'Jugados']], ui.matchTab, 'match-tab')}${groupChips()}<section class="sec">${body}</section></div>`;
}

function courtHtml(m, si) {
  const n = FORMATS[m.format] || 4;
  const set = m.sets[si];
  const L = fitLineup(set.lineup, n);
  const rot = ui.match.rot % n;
  const at = p => L[(p - 1 + rot) % n];
  const rows = LAYOUT[n].map((row, ri) => `<div class="crow">${row.map(p => {
    if (!p) return '<span></span>';
    const pid = at(p), pl = pid && S.players[pid];
    return `<button class="slot${pl ? '' : ' empty'}${ui.match.slot === p ? ' picking' : ''}${p === 1 ? ' serve' : ''}" data-act="slot" data-p="${p}" ${rot ? 'disabled' : ''} aria-label="Posición ${p}${pl ? ': ' + esc(pl.name) : ', vacía'}"><span class="pos">${p}</span><span class="pn">${pl ? esc(firstName(pl.name)) : 'Elegir'}</span></button>`;
  }).join('')}</div>` + (ri === 0 && LAYOUT[n].length > 1 ? '<div class="aline" aria-hidden="true"></div>' : '')).join('');
  const order = [...Array(n)].map((_, i) => { const pid = L[(i + rot) % n]; return pid && S.players[pid] ? firstName(S.players[pid].name) : 'hueco'; });
  let picker = '';
  if (ui.match.slot > 0 && !rot) {
    const cands = (m.roster || []).length ? m.roster.map(id => S.players[id]).filter(Boolean).sort(byName) : playersFor(m.group);
    picker = `<div class="slotpick"><p><b>Posición ${ui.match.slot}</b>: ¿quién empieza aquí?</p>${cands.length ? `<div class="chips">${cands.map(p => `<button class="chip" data-act="pick-player" data-id="${m.id}" data-p="${p.id}" aria-pressed="${L[ui.match.slot - 1] === p.id}">${esc(p.name)}</button>`).join('')}</div>` : '<p class="muted">Añade jugadores a la plantilla o a la convocatoria.</p>'}<div class="btnrow"><button class="btn small" data-act="slot-clear" data-id="${m.id}">Dejar vacío</button><button class="btn small" data-act="slot" data-p="${ui.match.slot}">Cerrar</button></div></div>`;
  }
  return `<div class="net" aria-hidden="true"></div><div class="court" role="group" aria-label="Rotación del set ${si + 1}">${rows}</div>
    <p class="muted small" style="margin-top:8px">${rot ? `Rotación ${rot + 1} de ${n}. Saca quien está en la posición 1.` : 'La posición 1 saca. Toca un hueco para colocar a alguien.'}</p>
    <p style="margin-top:4px"><b>Orden de saque:</b> ${esc(order.join(', '))}</p>
    <div class="btnrow"><button class="btn" data-act="rot">${ic.rotate}Girar rotación</button>${rot ? '<button class="btn" data-act="rot0">Volver a la inicial</button>' : ''}${si > 0 && !rot ? `<button class="btn small" data-act="copy-lineup" data-id="${m.id}">Copiar la del set ${si}</button>` : ''}</div>${picker}`;
}

function vMatch({id}) {
  const m = S.matches[id];
  if (!m) return null;
  if (!Array.isArray(m.sets) || !m.sets.length) m.sets = [{us: 0, them: 0, lineup: []}];
  const sets = m.sets;
  const si = Math.min(Math.max(0, ui.match.set), sets.length - 1);
  ui.match.set = si;
  const pool = playersFor(m.group);
  const roster = new Set(m.roster || []);
  const others = allPlayers().filter(p => !pool.includes(p));
  const r = matchResult(m);
  const setRows = sets.map((x, i) => `<span class="setname">Set ${i + 1}</span>
    <div class="stepper"><button data-act="score" data-id="${id}" data-i="${i}" data-side="us" data-d="-1" aria-label="Quitar un punto nuestro en el set ${i + 1}">−</button><input id="sc-${id}-${i}-us" type="number" inputmode="numeric" min="0" max="99" data-bind="score" data-id="${id}" data-i="${i}" data-side="us" value="${+x.us || 0}" aria-label="Puntos nuestros en el set ${i + 1}"><button data-act="score" data-id="${id}" data-i="${i}" data-side="us" data-d="1" aria-label="Sumar un punto nuestro en el set ${i + 1}">+</button></div>
    <span class="dash" aria-hidden="true">a</span>
    <div class="stepper"><button data-act="score" data-id="${id}" data-i="${i}" data-side="them" data-d="-1" aria-label="Quitar un punto del rival en el set ${i + 1}">−</button><input id="sc-${id}-${i}-them" type="number" inputmode="numeric" min="0" max="99" data-bind="score" data-id="${id}" data-i="${i}" data-side="them" value="${+x.them || 0}" aria-label="Puntos del rival en el set ${i + 1}"><button data-act="score" data-id="${id}" data-i="${i}" data-side="them" data-d="1" aria-label="Sumar un punto del rival en el set ${i + 1}">+</button></div>
    ${sets.length > 1 ? `<button class="icon-btn tiny soft" data-act="set-del" data-id="${id}" data-i="${i}" aria-label="Borrar set ${i + 1}">${ic.x}</button>` : '<span></span>'}`).join('');
  const chip = p => `<button class="chip person" data-act="roster" data-id="${id}" data-p="${p.id}" aria-pressed="${roster.has(p.id)}">${esc(p.name)}</button>`;
  return header('vs ' + (m.rival || 'rival'), {back: true, action: `<button class="hbtn" data-act="edit-match" data-id="${id}"><span>Editar</span></button>`}) + `<div class="page">
    <div class="score"><div><span>${esc(m.group || 'Nosotros')}</span><b>${r ? r.w : 0}</b></div><span class="vs">sets</span><div><span>${esc(m.rival || 'Rival')}</span><b>${r ? r.l : 0}</b></div></div>
    <p class="sub" style="margin-top:10px">${esc([fLong(m.date), m.time, m.home === 'fuera' ? 'Fuera' : 'En casa', m.place, m.competition, m.format].filter(Boolean).join(', '))}</p>
    <section class="sec"><h2>Marcador</h2>
      <div class="setgrid"><span></span><span class="hd">Nosotros</span><span></span><span class="hd">Rival</span><span></span>${setRows}</div>
      <div class="btnrow"><button class="btn small" data-act="set-add" data-id="${id}">${ic.plus}Añadir set</button></div>
    </section>
    <section class="sec"><h2>Convocatoria <span class="count">${roster.size ? plural(roster.size, 'persona', 'personas') : ''}</span></h2>
      ${allPlayers().length ? `<div class="chips">${pool.map(chip).join('')}</div>
        ${others.length && pool.length !== allPlayers().length ? `<details><summary>Otros grupos</summary><div class="chips">${others.map(chip).join('')}</div></details>` : ''}
        <div class="btnrow"><button class="btn small" data-act="roster-all" data-id="${id}">Convocar a todo el grupo</button>${roster.size ? `<button class="btn small" data-act="roster-none" data-id="${id}">Quitar todo</button>` : ''}</div>`
        : empty('Añade a tu plantilla para hacer la convocatoria.', `<button class="btn small" data-act="tab" data-tab="players">Ir a la plantilla</button>`)}
    </section>
    ${coachSection('matches', m, 'Cuerpo técnico en este partido')}
    <section class="sec"><h2>Rotación</h2>
      ${sets.length > 1 ? `<div class="chips" style="margin-bottom:12px" role="group" aria-label="Set">${sets.map((_, i) => `<button class="chip" data-act="set-sel" data-i="${i}" aria-pressed="${i === si}">Set ${i + 1}</button>`).join('')}</div>` : ''}
      ${courtHtml(m, si)}
    </section>
    <section class="sec"><h2>Cómo fue</h2>
      <label class="field"><span>Lo que salió bien</span><textarea id="mg-${id}" data-bind="m-good" data-id="${id}" rows="3" placeholder="Ej.: recepción mucho más segura, se animaban entre ellos">${esc(m.good)}</textarea></label>
      <label class="field"><span>Para mejorar</span><textarea id="mb-${id}" data-bind="m-bad" data-id="${id}" rows="3" placeholder="Ej.: fallamos muchos saques en el segundo set">${esc(m.bad)}</textarea></label>
    </section>
    <section class="sec"><h2>Notas individuales</h2>${pnList('matches', m)}${pnComposer('matches', m, (m.roster || []).length ? (m.roster || []).map(i => S.players[i]).filter(Boolean).sort(byName) : pool)}</section>

function exCard(ex, hist) {

  if (st.last && (st.last.rethink || st.last.result === 'desastre')) flags += '<span class="tag bad">Replantear</span>';
  const dots = (st.exito + st.regular + st.desastre) ? `<span class="rdots">${st.exito ? `<span><i class="ok"></i>${st.exito}</span>` : ''}${st.regular ? `<span><i class="mid"></i>${st.regular}</span>` : ''}${st.desastre ? `<span><i class="bad"></i>${st.desastre}</span>` : ''}</span>` : '';
  return `<button class="card" data-act="open" data-view="exercise" data-id="${ex.id}"><span class="catmark c-${esc(ex.category)}" aria-hidden="true"></span><span class="grow"><span class="t">${esc(ex.name)}</span><span class="sub">${esc([cat.name, coursesLabel(ex.courses), ex.duration ? ex.duration + ' min' : ''].filter(Boolean).join(', '))}</span><span class="meta"><span>${st.n ? 'Usado ' + plural(st.n, 'vez', 'veces') : 'Sin usar todavía'}</span>${dots}${flags}</span></span></button>`;

function summaryData() {
  const {sessions, matches, start} = progData();
  const pname = id => S.players[id] ? S.players[id].name : 'alguien que ya no está';
  const lines = [];
  sessions.forEach(s => {
    const pool = playersFor(s.group).length;
    lines.push(`ENTRENO ${s.date}${s.group ? ' (' + s.group + ')' : ''}.${coachNames(s.coaches) ? ' Entrenadores: ' + coachNames(s.coaches) + '.' : ''}${s.objective ? ' Objetivo: ' + s.objective + '.' : ''}${(s.attendance || []).length ? ` Asistencia: ${s.attendance.length} de ${pool}.` : ''}`);
    if (s.warmup) lines.push(`  Calentamiento: ${s.warmup.name}`);
    (s.items || []).forEach(it => lines.push(`  - ${it.block === 'activacion' ? '[juego de activación] ' : ''}${it.name}: ${RESULTS[it.result] ? RESULTS[it.result].long : 'sin evaluar'}${it.levelUp ? ', lista para subir nivel' : ''}${it.rethink ? ', hay que replantearlo' : ''}${it.note ? '. Nota: ' + it.note : ''}`));
    (s.playerNotes || []).forEach(n => lines.push(`  * ${pname(n.playerId)} (${(TAGS[n.tag] || TAGS.general).name}): ${n.text}`));
    if (s.notes) lines.push('  Notas generales: ' + s.notes);
  });
  matches.forEach(m => {
    const r = matchResult(m);
    lines.push(`PARTIDO ${m.date} vs ${m.rival || 'rival'}${m.group ? ' (' + m.group + ')' : ''}${coachNames(m.coaches) ? ', con ' + coachNames(m.coaches) : ''}: ${r ? `sets ${(m.sets || []).filter(x => (+x.us || 0) + (+x.them || 0) > 0).map(x => (+x.us || 0) + '-' + (+x.them || 0)).join(', ')} (${r.res === 'win' ? 'ganado' : r.res === 'loss' ? 'perdido' : 'empate'})` : 'sin resultado'}.${m.good ? ' Bien: ' + m.good + '.' : ''}${m.bad ? ' A mejorar: ' + m.bad + '.' : ''}`);
    (m.playerNotes || []).forEach(n => lines.push(`  * ${pname(n.playerId)} (${(TAGS[n.tag] || TAGS.general).name}): ${n.text}`));
  });
  const ps = allPlayers().filter(p => !ui.group || p.group === ui.group);
  ps.forEach(p => (p.notes || []).forEach(n => { if (n.date >= start) lines.push(`NOTA ${n.date} sobre ${p.name} (${(TAGS[n.tag] || TAGS.general).name}): ${n.text}`); }));
  const skl = ps.filter(p => p.skills && Object.values(p.skills).some(v => +v > 0)).map(p => `${p.name}: ` + SKILLS.filter(s => +p.skills[s.id]).map(s => `${s.name.toLowerCase()} ${p.skills[s.id]}`).join(', '));
  let text = lines.join('\n');
  if (text.length > 60000) text = text.slice(text.length - 60000);
  if (skl.length) text += '\nNIVEL ACTUAL DE 1 A 5:\n' + skl.join('\n').slice(0, 8000);
  return {text, count: sessions.length + matches.length};
}

function vProgress() {
  const {sessions, matches, start} = progData();
  const items = sessions.flatMap(s => (s.items || []).map(it => ({s, it})));
  const evald = items.filter(x => RESULTS[x.it.result]);
  const okPct = evald.length ? Math.round(evald.filter(x => x.it.result === 'exito').length * 100 / evald.length) : null;
  const attS = sessions.filter(s => (s.attendance || []).length);
  const attPct = attS.length ? Math.min(100, Math.round(attS.reduce((a, s) => a + s.attendance.length / Math.max(1, playersFor(s.group).length), 0) / attS.length * 100)) : null;
  const rs = matches.map(matchResult).filter(Boolean);
  const w = rs.filter(r => r.res === 'win').length, l = rs.filter(r => r.res === 'loss').length;

  const agg = {};
  items.forEach(({s, it}) => {
    const ex = it.exerciseId && S.exercises[it.exerciseId];
    const key = ex ? it.exerciseId : 'n:' + norm(it.name);
    const a = agg[key] || (agg[key] = {id: ex ? ex.id : null, name: ex ? ex.name : it.name, n: 0, exito: 0, regular: 0, desastre: 0, last: null});
    a.n++; if (a[it.result] != null) a[it.result]++;
    if (it.result || it.levelUp || it.rethink) a.last = Object.assign({}, it, {date: s.date});
  });
  const A_ = Object.values(agg);
  const works = A_.filter(a => a.exito > 0).sort((x, y) => (y.exito - x.exito) || (y.exito / y.n - x.exito / x.n)).slice(0, 5);
  const up = A_.filter(a => a.last && a.last.levelUp);
  const re = A_.filter(a => a.last && (a.last.rethink || a.last.result === 'desastre'));

  const pname = id => S.players[id] ? S.players[id].name : 'Ya no está';
  const notes = [];
  sessions.forEach(s => (s.playerNotes || []).forEach(n => { if (n.tag === 'mejorar') notes.push({date: s.date, who: pname(n.playerId), text: n.text, view: 'session', id: s.id}); }));
  matches.forEach(m => (m.playerNotes || []).forEach(n => { if (n.tag === 'mejorar') notes.push({date: m.date, who: pname(n.playerId), text: n.text, view: 'match', id: m.id}); }));
  allPlayers().filter(p => !ui.group || p.group === ui.group).forEach(p => (p.notes || []).forEach(n => { if (n.tag === 'mejorar' && n.date >= start) notes.push({date: n.date, who: p.name, text: n.text, view: 'player', id: p.id}); }));
  notes.sort((a, b) => b.date.localeCompare(a.date));

  const ps = allPlayers().filter(p => !ui.group || p.group === ui.group);
  const avgs = SKILLS.map(sk => { const vals = ps.map(p => +((p.skills || {})[sk.id]) || 0).filter(v => v > 0); return {sk, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null}; });
  const rated = avgs.filter(a => a.avg != null);
  const lowest = rated.length > 1 ? rated.reduce((m, a) => a.avg < m.avg ? a : m) : null;
  const attList = ps.map(p => ({p, a: playerAttendance(p)})).filter(x => x.a).sort((x, y) => y.a.pct - x.a.pct);

  const P = ui.sum, sm = S.meta.summary;
  let ai;
  if (AI.ready && !aiProvider()) ai = '<p class="muted">Para el resumen con IA, añade tu clave gratuita de Gemini. Los datos de abajo se calculan igualmente.</p><div class="btnrow"><button class="btn primary" data-act="open-settings">Configurar la IA</button></div>';
  else if (P.loading) ai = `<div class="thinking"><span class="ld-ball small">${BALL}</span><p>Leyendo tus notas y preparando el resumen. Puede tardar hasta un minuto.</p></div><div class="btnrow"><button class="btn" data-act="sum-stop">Parar</button></div>`;
  else ai = `<button class="btn primary" data-act="sum-go" ${AI.ready && aiProvider() ? '' : 'disabled'}>${ic.spark}${sm ? 'Actualizar resumen' : 'Generar resumen'}</button>`;
  if (P.error) ai += `<p class="err" role="alert">${esc(P.error)}</p>`;
  if (sm && !P.loading) ai += renderSummary(sm);

  return header('Progreso', {big: true}) + `<div class="page">
    ${seg(Object.entries(PERIODS).map(([k, v]) => [k, k === '30' ? '30 días' : k === '90' ? '3 meses' : k === 'season' ? 'Temporada' : 'Todo']), ui.prog.period, 'period')}
    ${groupChips()}
    <div class="stats">
      <div class="stat"><b>${sessions.length}</b><span>entrenos hechos</span></div>
      <div class="stat"><b>${attPct != null ? attPct + '%' : 'Sin datos'}</b><span>asistencia media</span></div>
      <div class="stat"><b>${rs.length ? `${w}-${l}` : 'Sin datos'}</b><span>partidos ganados y perdidos</span></div>
      <div class="stat"><b>${okPct != null ? okPct + '%' : 'Sin datos'}</b><span>ejercicios que salieron genial</span></div>
    </div>
    <section class="sec aicard"><h2>Resumen del progreso</h2><p class="muted">Lee las notas de entrenos y partidos (${esc(progLabel())}) y te dice qué va bien y qué toca mejorar.</p>${ai}</section>
    <section class="sec"><h2>Ejercicios que funcionan</h2>${works.length ? `<div class="list">${works.map(a => aggRow(a, `${a.exito} de ${a.n} veces genial`)).join('')}</div>` : '<p class="muted">Cuando evalúes ejercicios como «Genial», aparecerán aquí.</p>'}</section>
    <section class="sec"><h2>Listos para subir de nivel</h2>${up.length ? `<div class="list">${up.map(a => aggRow(a, `Marcado el ${fShort(a.last.date)}${a.last.note ? ': ' + a.last.note : ''}`)).join('')}</div>` : '<p class="muted">Marca «Subir nivel» en un ejercicio del entreno y lo verás aquí.</p>'}</section>
    <section class="sec"><h2>Para replantear</h2>${re.length ? `<div class="list">${re.map(a => aggRow(a, `${a.last.result === 'desastre' ? 'Salió mal' : 'Marcado para replantear'} el ${fShort(a.last.date)}${a.last.note ? ': ' + a.last.note : ''}`)).join('')}</div>` : '<p class="muted">Nada marcado como desastre o para replantear en este periodo.</p>'}</section>
    <section class="sec"><h2>Notas «a mejorar»</h2>${notes.length ? `<div class="note-list">${notes.slice(0, 10).map(n => `<div class="note"><div class="grow"><b>${esc(n.who)}</b> <span class="src">${esc(fShort(n.date))}, <button class="linklike" data-act="open" data-view="${n.view}" data-id="${n.id}">ver</button></span><p>${esc(n.text)}</p></div></div>`).join('')}</div>` : '<p class="muted">No hay notas marcadas como «A mejorar» en este periodo.</p>'}</section>
    <section class="sec"><h2>Nivel medio del grupo</h2>${rated.length ? `<div class="panel">${avgs.map(a => a.avg == null ? '' : `<div class="sbar${lowest && a === lowest ? ' low' : ''}"><span>${a.sk.name}</span><div class="track" aria-hidden="true"><i style="width:${(a.avg / 5 * 100).toFixed(0)}%"></i></div><b>${a.avg.toFixed(1).replace('.', ',')}</b></div>`).join('')}${lowest ? `<p class="muted small" style="margin-top:6px">Lo más flojo ahora mismo: ${esc(lowest.sk.name.toLowerCase())}.</p>` : ''}</div>` : '<p class="muted">Puntúa el nivel en la ficha de cada jugador para ver la media.</p>'}
      ${attList.length ? `<details><summary>Asistencia de cada jugador</summary>${attList.map(x => `<div class="arow"><button class="linklike" data-act="open" data-view="player" data-id="${x.p.id}">${esc(x.p.name)}</button><span>${x.a.pres} de ${x.a.tot} (${x.a.pct}%)</span></div>`).join('')}</details>` : ''}
    </section>
    <section class="sec"><h2>Datos y ajustes</h2>
      <div class="panel">
        <p>${Store.mode === 'db' ? 'Tus datos se guardan en tu cuenta de Claude y solo los ves tú.' : 'Tus datos se guardan en este dispositivo. Haz una copia de vez en cuando para no perderlos y para pasarlos a otro móvil.'}</p>
        <p class="muted small" style="margin-top:6px">${SET.lastBackup ? 'Última copia: ' + esc(new Intl.DateTimeFormat('es-ES', {day: 'numeric', month: 'long'}).format(new Date(SET.lastBackup))) : 'Todavía no has hecho ninguna copia.'}</p>
        ${Store.mode !== 'db' && Object.keys(S.sessions).length && (!SET.lastBackup || Date.now() - SET.lastBackup > 14 * 864e5) ? '<p class="err" style="margin-top:8px">Hace tiempo que no guardas una copia. Si se borran los datos del navegador, perderías tus notas.</p>' : ''}
        <div class="btnrow"><button class="btn primary" data-act="backup">Guardar copia</button><button class="btn" data-act="import">Importar copia</button></div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
        <div class="btnrow"><button class="btn" data-act="open-settings">${ic.spark}Ajustes de IA</button><span class="muted small">${aiProvider() === 'claude' ? 'Usando la IA de Claude' : aiProvider() === 'gemini' ? 'Usando Gemini' : 'IA sin configurar'}</span></div>
      </div>
    </section>
  </div>`;
}

let F = null;
function openSheet(kind, data) { F = Object.assign({kind}, data); sheetRoot.classList.add('open'); document.body.classList.add('noscroll'); renderSheet(true); }
function closeSheet() { F = null; sheetRoot.classList.remove('open'); sheetRoot.innerHTML = ''; document.body.classList.remove('noscroll'); }
function renderSheet(first) {
  if (!F) return;
  const body = sheetRoot.querySelector('.sheet-body');
  const st = body ? body.scrollTop : 0;
  const {title, html, foot} = SHEETS[F.kind]();
  withFocus(() => {
    sheetRoot.innerHTML = `<div class="scrim" data-act="close-sheet"></div><div class="sheet${first ? ' enter' : ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2><button class="icon-btn soft" data-act="close-sheet" aria-label="Cerrar">${ic.x}</button></div><div class="sheet-body">${html}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div>`;
  });
  const nb = sheetRoot.querySelector('.sheet-body');
  if (nb && !first) nb.scrollTop = st;

function makePdf(imgs) {

  begin(1); put('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  begin(2); put(`<< /Type /Pages /Kids [${imgs.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] /Count ${n} >>\nendobj\n`);
  imgs.forEach((im, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    begin(pid); put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>\nendobj\n`);
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    begin(cid); put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    begin(iid); put(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`); put(im.bytes); put('\nendstream\nendobj\n');

}
async function saveBlob(blob, filename, title) {
  if (DL) {
    try { await DL.save({filename, data: blob}); return true; }
    catch (e) { if (!e || e.code !== 'declined') toast('No se ha podido guardar el archivo.'); return false; }
  }
  let file = null; try { file = new File([blob], filename, {type: blob.type}); } catch (e) {}
  if (file && navigator.canShare && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title}); return true; } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return true;
  } catch (e) { toast('No se ha podido guardar el archivo.'); return false; }
}

function photoFromFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('read'));
    r.onload = async () => {
      const im = await EXP.img(r.result);
      if (!im) { reject(new Error('decode')); return; }
      const w0 = im.naturalWidth || im.width, h0 = im.naturalHeight || im.height;
      const sc = Math.min(1, 720 / Math.max(w0, h0));

      resolve(out);
    };

function doImport(file) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (e) { toast('Ese archivo no es una copia de la Pizarra de vóley.'); return; }
    if (!d || !['libreta-voley', 'pizarra-voley'].includes(d.app)) { toast('Ese archivo no es una copia de la Pizarra de vóley.'); return; }
    const n = {};
    ['players', 'coaches', 'exercises', 'routines', 'sessions', 'matches', 'meta'].forEach(c => {
      const src = d[c];
      if (!src || typeof src !== 'object') return;
      Object.values(src).forEach(o => {
        if (!o || typeof o !== 'object' || typeof o.id !== 'string' || !o.id) return;
        if (Store.mode === 'db') Store.save(c, clone(o)); else S[c][o.id] = clone(o);
        n[c] = (n[c] || 0) + 1;
      });
    });
    if (Store.mode !== 'db') Store.saveLocal();
    render();
    const parts = [n.players && plural(n.players, 'jugador', 'jugadores'), n.coaches && plural(n.coaches, 'entrenador', 'entrenadores'), n.sessions && plural(n.sessions, 'entreno', 'entrenos'), n.matches && plural(n.matches, 'partido', 'partidos'), n.exercises && plural(n.exercises, 'ejercicio', 'ejercicios')].filter(Boolean);
    toast(parts.length ? 'Copia importada: ' + listJoin(parts) : 'La copia estaba vacía');
  };
  r.onerror = () => toast('No se ha podido leer el archivo.');
  r.readAsText(file);
}

/* ================= Toast ================= */
let toastT = null, lastUndo = null;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Deshacer</button>' : ''}`;
  t.classList.add('show');
  lastUndo = undo || null;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove('show'); lastUndo = null; }, undo ? 5500 : 2600);
}

/* ================= Acciones ================= */
const sess = id => S.sessions[id], mat = id => S.matches[id];
const A = {
  tab(d) { nav.tab = d.tab; nav.stack = []; resetDetailUi(); if (F) closeSheet(); render(); window.scrollTo(0, 0); },
  back() { nav.stack.pop(); resetDetailUi(); render(); window.scrollTo(0, 0); },
  open(d) { if (F) closeSheet(); go(d.view, {id: d.id}); },
  group(d) { ui.group = d.g; render(); },
  'sess-tab'(d) { ui.sessTab = d.v; render(); },
  'match-tab'(d) { ui.matchTab = d.v; render(); },
  'ex-tab'(d) { ui.exTab = d.v; render(); },
  'ex-cat'(d) { ui.exCat = d.v; render(); },
  period(d) { ui.prog.period = d.v; ui.sum.error = ''; render(); },
  undo() { const u = lastUndo; lastUndo = null; $('#toast').classList.remove('show'); if (u) { u(); render(); } },

  calday(d) { ui.cal.sel = d.date; render(); },
  calmove(d) { let m = ui.cal.m + (+d.d), y = ui.cal.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } ui.cal.m = m; ui.cal.y = y; render(); },
  caltoday() { const n = new Date(); ui.cal = {y: n.getFullYear(), m: n.getMonth(), sel: todayStr()}; render(); },

  del(d, el) {
    if (el.dataset.armed !== '1') {
      el.dataset.armed = '1'; const old = el.innerHTML; el.textContent = 'Toca otra vez para borrar'; el.classList.add('armed');
      setTimeout(() => { if (el.isConnected && el.dataset.armed === '1') { el.dataset.armed = ''; el.innerHTML = old; el.classList.remove('armed'); } }, 3500);
      return;
    }
    const obj = clone(S[d.kind][d.id]);
    Store.remove(d.kind, d.id); nav.stack.pop(); render(); window.scrollTo(0, 0);
