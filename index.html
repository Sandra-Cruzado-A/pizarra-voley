  },

  /* Entrenos */
  'new-session'(d) { openSheet('session', sessionDefaults(d.date)); },
  'edit-session'(d) { const s = sess(d.id); if (!s) return; openSheet('session', Object.assign(clone(s), {items: clone(s.items || []), coaches: (s.coaches || []).slice(), coachesTouched: true, pickQ: '', pickCat: '', quick: ''})); },
  'dup-session'(d) { const s = sess(d.id); if (!s) return; openSheet('session', sessionDefaults(addDays(s.date, 7), {time: s.time, duration: s.duration, group: s.group, place: s.place, objective: s.objective, coaches: (s.coaches || []).slice(), warmup: s.warmup ? clone(s.warmup) : null, stretch: s.stretch ? clone(s.stretch) : null, expected: Array.isArray(s.expected) ? s.expected.slice() : undefined, teams: clone(s.teams || []), items: (s.items || []).map(it => Object.assign({}, it, {uid: newId(), result: '', levelUp: false, rethink: false, note: ''}))})); },
  'save-session'() {
    if (!F.date) { toast('Elige una fecha para el entreno.'); return; }
    const prev = F.id ? S.sessions[F.id] : null;
    const s = {
      id: F.id || newId(), date: F.date, time: F.time || '', duration: clampInt(F.duration, 0, 600), group: String(F.group || '').trim(), place: String(F.place || '').trim(), objective: String(F.objective || '').trim(),
      items: F.items.map(it => Object.assign({}, it, {minutes: clampInt(it.minutes, 0, 180)})),
      coaches: (F.coaches || []).filter(id => S.coaches[id]),
      warmup: F.warmup || null, stretch: F.stretch || null,
      expected: prev ? prev.expected : (Array.isArray(F.expected) ? F.expected : defaultExpected(String(F.group || '').trim())),
      teams: prev ? (prev.teams || []) : (F.teams || []),
      status: prev ? prev.status : 'planificado', attendance: prev ? (prev.attendance || []) : [], playerNotes: prev ? (prev.playerNotes || []) : [], notes: prev ? (prev.notes || '') : '', createdAt: prev ? prev.createdAt : Date.now(),
    };
    Store.save('sessions', s);
    let copies = 0;
    if (!F.id && F.repeat && F.until && F.until > F.date) {
      let d = addDays(F.date, 7);
      while (d <= F.until && copies < 52) {
        Store.save('sessions', Object.assign(clone(s), {id: newId(), date: d, createdAt: Date.now(), items: s.items.map(it => Object.assign({}, it, {uid: newId(), result: '', levelUp: false, rethink: false, note: ''}))}));
        copies++; d = addDays(d, 7);
      }
    }
    const isNew = !F.id;
    closeSheet();
    if (isNew) { calTo(s.date); go('session', {id: s.id}); } else render();
    toast(copies ? `Entreno guardado y repetido ${plural(copies, 'semana', 'semanas')} más` : 'Entreno guardado');
  },
  'toggle-done'(d) { const s = sess(d.id); if (!s) return; s.status = s.status === 'hecho' ? 'planificado' : 'hecho'; Store.save('sessions', s); render(); if (s.status === 'hecho') toast('Entreno marcado como hecho'); },
  eval(d) { const s = sess(d.id); const it = s && s.items[+d.i]; if (!it) return; it.result = it.result === d.v ? '' : d.v; Store.save('sessions', s); render(); },
  flag(d) { const s = sess(d.id); const it = s && s.items[+d.i]; if (!it) return; it[d.flag] = !it[d.flag]; Store.save('sessions', s); render(); },
  att(d) { const s = sess(d.id); if (!s) return; const a = new Set(s.attendance || []); a.has(d.p) ? a.delete(d.p) : a.add(d.p); s.attendance = [...a]; Store.save('sessions', s); render(); },
  'att-all'(d) { const s = sess(d.id); if (!s) return; s.attendance = [...new Set([...(s.attendance || []), ...playersFor(s.group).map(p => p.id)])]; Store.save('sessions', s); render(); },
  'att-expected'(d) { const s = sess(d.id); if (!s) return; s.attendance = [...new Set([...(s.attendance || []), ...expectedOf(s)])]; Store.save('sessions', s); render(); },
  /* Quién viene y grupos */
  'exp-toggle'(d) {
    const s = sess(d.id); if (!s) return;
    const set = new Set(expectedOf(s));
    if (set.has(d.p)) { set.delete(d.p); (s.teams || []).forEach(t => { t.members = (t.members || []).filter(x => x !== d.p); }); } else set.add(d.p);
    s.expected = [...set]; Store.save('sessions', s); render();
  },
  'exp-all'(d) { const s = sess(d.id); if (!s) return; s.expected = [...new Set([...expectedOf(s), ...playersFor(s.group).map(p => p.id)])]; Store.save('sessions', s); render(); },
  'exp-none'(d) { const s = sess(d.id); if (!s) return; s.expected = []; (s.teams || []).forEach(t => { t.members = []; }); Store.save('sessions', s); render(); },
  'team-count'(d) { ui.teamCount = +d.v || 2; render(); },
  'team-random'(d) {
    const s = sess(d.id); if (!s) return;
    const ids = shuffle(expectedOf(s)), n = Math.min(ui.teamCount, Math.max(1, ids.length));
    s.teams = makeTeams(n); ids.forEach((id, i) => s.teams[i % n].members.push(id));
    ui.teamPick = ''; Store.save('sessions', s); render(); toast(`Repartidos en ${n} grupos`);
  },
  'team-balance'(d) {
    const s = sess(d.id); if (!s) return;
    const ps = shuffle(expectedOf(s)).map(id => ({id, lv: playerLevel(S.players[id])}));
    const rated = ps.filter(p => p.lv != null).length;
    ps.sort((a, b) => (b.lv == null ? 2.5 : b.lv) - (a.lv == null ? 2.5 : a.lv));
    const n = Math.min(ui.teamCount, Math.max(1, ps.length));
    s.teams = makeTeams(n);
    ps.forEach((p, i) => { const r = Math.floor(i / n), k = i % n; s.teams[r % 2 ? n - 1 - k : k].members.push(p.id); });
    ui.teamPick = ''; Store.save('sessions', s); render();
    toast(rated ? `Equilibrados en ${n} grupos según su nivel` : 'Nadie tiene nivel puntuado: los he repartido al azar. Puntúa el nivel en cada ficha para equilibrar mejor.');
  },
  'team-clear'(d) { const s = sess(d.id); if (!s) return; const before = clone(s.teams || []); s.teams = []; ui.teamPick = ''; Store.save('sessions', s); render(); toast('Grupos quitados', () => { const x = sess(d.id); if (x) { x.teams = before; Store.save('sessions', x); } }); },
  'team-pick'(d) { ui.teamPick = ui.teamPick === d.p ? '' : d.p; render(); },
  'team-move'(d) {
    const top = nav.stack[nav.stack.length - 1], s = top && sess(d.id); if (!s || !ui.teamPick) return;
    const pid = ui.teamPick, t = +d.t;
    (s.teams || []).forEach(x => { x.members = (x.members || []).filter(m => m !== pid); });
    if (t >= 0 && s.teams[t]) s.teams[t].members.push(pid);
    ui.teamPick = ''; Store.save('sessions', s); render();
  },
  /* Resumen descargable */
  'export'(d) { openSheet('export', {id: d.id, notes: true, preview: '', busy: false, msg: '', msgErr: false, canvas: null}); exportPreview(); },
  'exp-notes'() { if (!F || F.busy) return; F.notes = !F.notes; exportPreview(); },
  async 'exp-png'() {
    const f = F, s = f && S.sessions[f.id]; if (!s || f.busy) return;
    f.busy = true; renderSheet();
    try { const cv = f.canvas || await renderExportImage(s, {notes: f.notes}); const blob = await canvasBlob(cv, 'image/png'); if (await saveBlob(blob, exportName(s, 'png'), 'Resumen del entreno')) toast('Imagen guardada'); }
    catch (e) { toast('No se ha podido crear la imagen.'); }
    finally { if (F === f) { f.busy = false; renderSheet(); } }
  },
  async 'exp-pdf'() {
    const f = F, s = f && S.sessions[f.id]; if (!s || f.busy) return;
    f.busy = true; f.msg = 'Preparando el PDF…'; f.msgErr = false; renderSheet();
    try {
      const pages = await renderExportPages(s, {notes: f.notes});
      const blob = makePdf(pages.map(cv => ({bytes: dataUrlBytes(cv.toDataURL('image/jpeg', 0.9)), w: cv.width, h: cv.height})));
      if (F === f) f.msg = '';
      if (await saveBlob(blob, exportName(s, 'pdf'), 'Resumen del entreno')) toast('PDF guardado');
    } catch (e) { if (F === f) { f.msg = 'No se ha podido crear el PDF.'; f.msgErr = true; } }
    finally { if (F === f) { f.busy = false; renderSheet(); } }
  },
  async 'exp-draw'() {
    const f = F, s = f && S.sessions[f.id]; if (!s || f.busy) return;
    const missing = exportMissing(s);
    f.busy = true; f.msgErr = false;
    for (let k = 0; k < missing.length; k++) {
      if (F !== f) return;
      f.msg = `Dibujando ${k + 1} de ${missing.length}: ${missing[k].name}…`; renderSheet();
      try { await drawExercise(missing[k]); }
      catch (e) { if (F === f) { f.msg = aiErr(e) || 'No se ha podido dibujar.'; f.msgErr = true; } break; }
    }
    if (F !== f) return;
    if (!f.msgErr) f.msg = '';
    f.busy = false; exportPreview();
  },
  /* Imagen de cada ejercicio */
  async 'ex-draw'(d) {
    const ex = S.exercises[d.id]; if (!ex || ui.drawing) return;
    ui.drawing = ex.id; ui.drawErr = ''; render();
    try { await drawExercise(ex); } catch (e) { ui.drawErr = aiErr(e) || 'No se ha podido dibujar.'; }
    finally { ui.drawing = ''; render(); }
  },
  'ex-photo'(d) { ui.photoFor = d.id; const f = $('#photo-file'); if (f) { f.value = ''; f.click(); } },
  'ex-img-del'(d, el) {
    arm(el, 'Toca otra vez para quitarla', () => { const ex = S.exercises[d.id]; if (!ex) return; delete ex[d.what]; Store.save('exercises', ex); render(); });
  },
  'ideas-for'(d) { ui.exTab = 'ideas'; ui.ideas.focus = d.v; render(); window.scrollTo(0, 0); },
  /* Rutinas */
  'new-routine'(d) { openSheet('routine', {rkind: d.kind, rname: '', steps: [], newStep: '', isDefault: !defaultRoutine(d.kind)}); },
  'routine-proposal'(d) { const pr = PROPOSALS[d.kind]; openSheet('routine', {rkind: d.kind, rname: pr.name, steps: pr.steps.map(([n, m]) => ({uid: newId(), name: n, minutes: m})), newStep: '', isDefault: !defaultRoutine(d.kind)}); },
  'edit-routine'(d) { const r = S.routines[d.id]; if (!r) return; openSheet('routine', {id: r.id, rkind: r.kind, rname: r.name, steps: clone(r.steps || []).map(st => Object.assign({uid: newId()}, st)), newStep: '', isDefault: !!r.isDefault}); },
  'rs-add'() { const n = String(F.newStep || '').trim(); if (!n) { toast('Escribe el paso.'); return; } F.steps.push({uid: newId(), name: n.slice(0, 120), minutes: F.rkind === 'calentamiento' ? 2 : 1}); F.newStep = ''; renderSheet(); },
  'rs-up'(d) { const i = +d.i; if (i < 1) return; const a = F.steps; [a[i - 1], a[i]] = [a[i], a[i - 1]]; renderSheet(); },
  'rs-del'(d) { F.steps.splice(+d.i, 1); renderSheet(); },
  'r-default'() { F.isDefault = !F.isDefault; renderSheet(); },
  'save-routine'() {
    const name = String(F.rname || '').trim();
    if (!name) { toast('Ponle un nombre a la rutina.'); return; }
    const pending = String(F.newStep || '').trim();
    if (pending) F.steps.push({uid: newId(), name: pending.slice(0, 120), minutes: 1});
    const steps = F.steps.map(st => ({uid: st.uid || newId(), name: String(st.name || '').trim().slice(0, 120), minutes: clampInt(st.minutes, 0, 60)})).filter(st => st.name);
    const prev = F.id ? S.routines[F.id] : null;
    const others = routinesOf(F.rkind).filter(r => r.id !== F.id);
    const r = {id: F.id || newId(), kind: F.rkind, name: name.slice(0, 60), steps, isDefault: !!F.isDefault || !others.length, createdAt: prev ? prev.createdAt : Date.now()};
    if (r.isDefault) others.filter(o => o.isDefault).forEach(o => { o.isDefault = false; Store.save('routines', o); });
    Store.save('routines', r);
    const key = r.kind === 'calentamiento' ? 'warmup' : 'stretch', t = todayStr();
    let n = 0;
    Object.values(S.sessions).forEach(s => { if (s.status === 'hecho' || s.date < t || !s[key] || s[key].routineId !== r.id) return; s[key] = snapRoutine(r); Store.save('sessions', s); n++; });
    closeSheet(); render();
    toast(n ? `Rutina guardada y actualizada en ${plural(n, 'entreno planificado', 'entrenos planificados')}` : 'Rutina guardada');
  },
  'del-routine'(d, el) {
    arm(el, 'Toca otra vez para borrarla', () => {
      const r = S.routines[F.id]; if (!r) return;
      const bak = clone(r); Store.remove('routines', r.id);
      if (r.isDefault) { const nx = routinesOf(r.kind)[0]; if (nx) { nx.isDefault = true; Store.save('routines', nx); } }
      closeSheet(); render(); toast('Rutina borrada', () => Store.save('routines', bak));
    });
  },
  'att-none'(d) { const s = sess(d.id); if (!s) return; const pool = new Set(playersFor(s.group).map(p => p.id)); s.attendance = (s.attendance || []).filter(id => !pool.has(id)); Store.save('sessions', s); render(); },

  /* Notas */
  'pn-tag'(d) { ui.pn.tag = d.v; render(); },
  'pn-add'(d) {
    const col = d.kind, o = S[col][d.id];
    if (!o) return;
    const pid = ui.pn.playerId || ($('#pn-player') && $('#pn-player').value);
    const text = String(ui.pn.text || '').trim();
    if (!pid) { toast('Elige a quién va la nota.'); return; }
    if (!text) { toast('Escribe la nota.'); return; }
    o.playerNotes = [...(o.playerNotes || []), {id: newId(), playerId: pid, tag: ui.pn.tag, text: text.slice(0, 2000)}];
    Store.save(col, o); ui.pn.text = ''; render(); toast('Nota añadida');
  },
  'note-add'(d) {
    const p = S.players[d.id]; if (!p) return;
    const text = String(ui.pn.text || '').trim();
    if (!text) { toast('Escribe la nota.'); return; }
    p.notes = [{id: newId(), date: todayStr(), tag: ui.pn.tag, text: text.slice(0, 2000)}, ...(p.notes || [])];
    Store.save('players', p); ui.pn.text = ''; render(); toast('Nota añadida');
  },
  'del-note'(d) {
    const o = S[d.kind][d.id]; if (!o) return;
    const field = d.kind === 'players' ? 'notes' : 'playerNotes';
    const before = clone(o[field] || []);
    o[field] = before.filter(n => n.id !== d.n);
    Store.save(d.kind, o); render();
    toast('Nota borrada', () => { const x = S[d.kind][d.id]; if (x) { x[field] = before; Store.save(d.kind, x); } });
  },

  /* Partidos */
  'new-match'(d) { const g = ui.group || lastOf('matches', 'group') || lastOf('sessions', 'group') || lastOf('players', 'group') || ''; openSheet('match', {date: d.date || ui.cal.sel || todayStr(), time: lastOf('matches', 'time') || '10:00', rival: '', group: g, coaches: coachIdsForGroup(g), place: '', home: 'casa', competition: lastOf('matches', 'competition') || '', format: lastOf('matches', 'format') || '4x4'}); },
  'edit-match'(d) { const m = mat(d.id); if (!m) return; openSheet('match', Object.assign(clone(m), {coaches: (m.coaches || []).slice(), coachesTouched: true})); },
  'f-home'(d) { F.home = d.v; renderSheet(); },
  'f-format'(d) { F.format = d.v; renderSheet(); },
  'save-match'() {
    if (!F.date) { toast('Elige una fecha para el partido.'); return; }
    const prev = F.id ? S.matches[F.id] : null;
    const m = {id: F.id || newId(), date: F.date, time: F.time || '', rival: String(F.rival || '').trim(), group: String(F.group || '').trim(), place: String(F.place || '').trim(), home: F.home || 'casa', competition: String(F.competition || '').trim(), format: FORMATS[F.format] ? F.format : '4x4',
      coaches: (F.coaches || []).filter(id => S.coaches[id]), roster: prev ? (prev.roster || []) : [], sets: prev ? (prev.sets || []) : [{us: 0, them: 0, lineup: []}], good: prev ? (prev.good || '') : '', bad: prev ? (prev.bad || '') : '', playerNotes: prev ? (prev.playerNotes || []) : [], createdAt: prev ? prev.createdAt : Date.now()};
    Store.save('matches', m);
    const isNew = !F.id; closeSheet();
    if (isNew) { calTo(m.date); go('match', {id: m.id}); } else render();
    toast('Partido guardado');
  },
  score(d) { const m = mat(d.id); const x = m && m.sets[+d.i]; if (!x) return; x[d.side] = Math.max(0, Math.min(99, (+x[d.side] || 0) + (+d.d))); Store.save('matches', m); render(); },
  'set-add'(d) { const m = mat(d.id); if (!m) return; const last = m.sets[m.sets.length - 1]; m.sets.push({us: 0, them: 0, lineup: last ? (last.lineup || []).slice() : []}); ui.match.set = m.sets.length - 1; ui.match.rot = 0; ui.match.slot = -1; Store.save('matches', m); render(); },
  'set-del'(d) { const m = mat(d.id); if (!m || m.sets.length < 2) return; const before = clone(m.sets); m.sets.splice(+d.i, 1); ui.match.set = 0; Store.save('matches', m); render(); toast('Set borrado', () => { const x = mat(d.id); if (x) { x.sets = before; Store.save('matches', x); } }); },
  'set-sel'(d) { ui.match.set = +d.i; ui.match.rot = 0; ui.match.slot = -1; render(); },
  roster(d) { const m = mat(d.id); if (!m) return; const r = new Set(m.roster || []); r.has(d.p) ? r.delete(d.p) : r.add(d.p); m.roster = [...r]; Store.save('matches', m); render(); },
  'roster-all'(d) { const m = mat(d.id); if (!m) return; m.roster = [...new Set([...(m.roster || []), ...playersFor(m.group).map(p => p.id)])]; Store.save('matches', m); render(); },
  'roster-none'(d) { const m = mat(d.id); if (!m) return; m.roster = []; Store.save('matches', m); render(); },
  slot(d) { if (ui.match.rot) return; ui.match.slot = ui.match.slot === +d.p ? -1 : +d.p; render(); },
  'pick-player'(d) {
    const m = mat(d.id); if (!m || ui.match.slot < 1) return;
    const n = FORMATS[m.format] || 4, set = m.sets[ui.match.set]; if (!set) return;
    const L = fitLineup(set.lineup, n), idx = ui.match.slot - 1, other = L.indexOf(d.p);
    if (other >= 0 && other !== idx) L[other] = L[idx] || null;
    L[idx] = d.p; set.lineup = L;
    if (!(m.roster || []).includes(d.p)) m.roster = [...(m.roster || []), d.p];
    const nextEmpty = L.findIndex(x => !x);
    ui.match.slot = nextEmpty >= 0 ? nextEmpty + 1 : -1;
    Store.save('matches', m); render();
  },
  'slot-clear'(d) { const m = mat(d.id); if (!m || ui.match.slot < 1) return; const set = m.sets[ui.match.set]; const L = fitLineup(set.lineup, FORMATS[m.format] || 4); L[ui.match.slot - 1] = null; set.lineup = L; ui.match.slot = -1; Store.save('matches', m); render(); },
  rot() { ui.match.slot = -1; ui.match.rot = ui.match.rot + 1; const top = nav.stack[nav.stack.length - 1]; const m = top && mat(top.id); const n = m ? (FORMATS[m.format] || 4) : 4; if (ui.match.rot >= n) ui.match.rot = 0; render(); },

  'copy-lineup'(d) { const m = mat(d.id); const si = ui.match.set; if (!m || si < 1) return; m.sets[si].lineup = (m.sets[si - 1].lineup || []).slice(); Store.save('matches', m); render(); toast('Rotación copiada'); },

  /* Plantilla */
  'new-player'() { openSheet('player', {name: '', names: '', course: lastOf('players', 'course') || '1º', group: ui.group || lastOf('players', 'group') || '', position: '', obs: '', multi: false}); },
  'edit-player'(d) { const p = S.players[d.id]; if (!p) return; openSheet('player', Object.assign(clone(p), {multi: false})); },
  'f-multi'(d) { F.multi = d.v === 'multi'; renderSheet(); },
  'save-player'() {
    const group = String(F.group || '').trim(), course = COURSES.includes(F.course) ? F.course : '1º';
    if (F.multi && !F.id) {
      const names = String(F.names || '').split('\n').map(s => s.trim()).filter(Boolean);
      if (!names.length) { toast('Escribe al menos un nombre.'); return; }
      names.forEach(n => Store.save('players', {id: newId(), name: n.slice(0, 60), course, group, position: '', obs: '', skills: {}, notes: [], createdAt: Date.now()}));
      closeSheet(); render(); toast(`${plural(names.length, 'ficha añadida', 'fichas añadidas')} a la plantilla`);
      return;
    }
    const name = String(F.name || '').trim();
    if (!name) { toast('Escribe el nombre.'); return; }
    const prev = F.id ? S.players[F.id] : null;
    const p = {id: F.id || newId(), name: name.slice(0, 60), course, group, position: String(F.position || '').trim(), obs: String(F.obs || '').trim(), skills: prev ? (prev.skills || {}) : {}, notes: prev ? (prev.notes || []) : [], createdAt: prev ? prev.createdAt : Date.now()};
    Store.save('players', p); closeSheet(); render(); toast(prev ? 'Ficha guardada' : 'Añadido a la plantilla');
  },
  skill(d) { const p = S.players[d.id]; if (!p) return; p.skills = Object.assign({}, p.skills); const v = +d.v; p.skills[d.k] = (+p.skills[d.k] === v) ? v - 1 : v; Store.save('players', p); render(); },

  /* Cuerpo técnico */
  'pl-tab'(d) { ui.plTab = d.v; render(); },
  'go-coaches'() { if (F) closeSheet(); nav.tab = 'players'; nav.stack = []; ui.plTab = 'coaches'; resetDetailUi(); render(); window.scrollTo(0, 0); },
  'new-coach'() { openSheet('coach', {name: '', role: '', groups: ui.group ? [ui.group] : [], phone: '', notes: '', newGroup: ''}); },
  'edit-coach'(d) { const c = S.coaches[d.id]; if (!c) return; openSheet('coach', Object.assign(clone(c), {groups: (c.groups || []).slice(), newGroup: ''})); },
  'fc-group'(d) { F.groups = F.groups.includes(d.v) ? F.groups.filter(g => g !== d.v) : [...F.groups, d.v]; renderSheet(); },
  'fc-group-add'() { const g = String(F.newGroup || '').trim().slice(0, 40); if (!g) { toast('Escribe el nombre del grupo.'); return; } if (!F.groups.includes(g)) F.groups.push(g); F.newGroup = ''; renderSheet(); },
  'save-coach'() {
    const name = String(F.name || '').trim();
    if (!name) { toast('Escribe el nombre.'); return; }
    const pending = String(F.newGroup || '').trim();
    if (pending && !F.groups.includes(pending)) F.groups.push(pending.slice(0, 40));
    const prev = F.id ? S.coaches[F.id] : null;
    const c = {id: F.id || newId(), name: name.slice(0, 60), role: String(F.role || '').trim().slice(0, 40), groups: F.groups.map(g => String(g).trim()).filter(Boolean), phone: String(F.phone || '').trim().slice(0, 30), notes: String(F.notes || '').trim(), createdAt: prev ? prev.createdAt : Date.now()};
    Store.save('coaches', c); closeSheet(); render(); toast(prev ? 'Ficha guardada' : 'Añadido al cuerpo técnico');
  },
  'f-coach'(d) { const a = F.coaches || []; F.coaches = a.includes(d.v) ? a.filter(x => x !== d.v) : [...a, d.v]; F.coachesTouched = true; renderSheet(); },
  'coach-toggle'(d) { const o = S[d.kind][d.id]; if (!o) return; const a = new Set(o.coaches || []); a.has(d.c) ? a.delete(d.c) : a.add(d.c); o.coaches = [...a]; Store.save(d.kind, o); render(); },

  /* Ejercicios */
  'new-exercise'(d) { openSheet('exercise', {name: '', category: (d && d.cat) || ui.exCat || 'juego', courses: [], level: 1, duration: 10, material: '', goal: '', description: '', variants: '', videosText: '', notes: ''}); },
  'edit-exercise'(d) { const e = S.exercises[d.id]; if (!e) return; openSheet('exercise', Object.assign(clone(e), {courses: e.courses || [], videosText: (e.videos || []).join('\n')})); },
  'f-course'(d) { F.courses = F.courses.includes(d.v) ? F.courses.filter(c => c !== d.v) : [...F.courses, d.v]; renderSheet(); },
  'f-level'(d) { F.level = +d.v; renderSheet(); },
  'save-exercise'() {
    const name = String(F.name || '').trim();
    if (!name) { toast('Ponle un nombre al ejercicio.'); return; }
    const prev = F.id ? S.exercises[F.id] : null;
    const e = Object.assign({}, prev || {}, {id: F.id || newId(), name: name.slice(0, 80), category: CATS[F.category] ? F.category : 'juego', courses: COURSES.filter(c => F.courses.includes(c)), level: clampInt(F.level, 1, 3) || 1, duration: clampInt(F.duration, 0, 120), material: String(F.material || '').trim(), goal: String(F.goal || '').trim(), description: String(F.description || '').trim(), variants: String(F.variants || '').trim(), videos: String(F.videosText || '').split(/\s+/).map(safeUrl).filter(Boolean).slice(0, 20), notes: String(F.notes || '').trim(), createdAt: prev ? prev.createdAt : Date.now()});
    delete e.kind; delete e.videosText;
    Store.save('exercises', e);
    const isNew = !F.id; closeSheet();
    if (isNew) go('exercise', {id: e.id}); else render();
    toast('Ejercicio guardado');
  },
  addto(d) { openSheet('addto', {exId: d.id}); },
  'addto-pick'(d) { const s = sess(d.id), ex = S.exercises[F.exId]; if (!s || !ex) return; s.items = [...(s.items || []), itemFrom(ex)]; Store.save('sessions', s); closeSheet(); render(); toast(`Añadido al entreno del ${fShort(s.date)}`); },
  'addto-new'() { const ex = S.exercises[F.exId]; closeSheet(); if (ex) openSheet('session', sessionDefaults(todayStr(), {items: [itemFrom(ex)]})); },

  /* Formulario de entreno: selector */
  'pick-cat'(d) { F.pickCat = d.v; renderSheet(); },
  'pick-add'(d) { const ex = S.exercises[d.id]; if (!ex) return; F.items.push(itemFrom(ex, F.pickTarget || 'principal')); renderSheet(); },
  'pick-target'(d) { F.pickTarget = d.v; F.pickCat = d.v === 'activacion' ? 'activacion' : ''; renderSheet(); },
  'pick-quick'() { const n = String(F.quick || '').trim(); if (!n) { toast('Escribe el nombre del ejercicio.'); return; } F.items.push({uid: newId(), exerciseId: null, name: n.slice(0, 80), minutes: F.pickTarget === 'activacion' ? 5 : 10, block: F.pickTarget || 'principal', result: '', levelUp: false, rethink: false, note: ''}); F.quick = ''; renderSheet(); },
  'fi-up'(d) { const i = +d.i, a = F.items, bl = x => x.block === 'activacion' ? 'a' : 'p'; let j = i - 1; while (j >= 0 && bl(a[j]) !== bl(a[i])) j--; if (j < 0) return; [a[j], a[i]] = [a[i], a[j]]; renderSheet(); },
  'fi-del'(d) { F.items.splice(+d.i, 1); renderSheet(); },
  'f-repeat'() { F.repeat = !F.repeat; renderSheet(); },
  'close-sheet'() { closeSheet(); },

  /* Ideas */
  'idea-course'(d) { const c = ui.ideas.courses; ui.ideas.courses = c.includes(d.v) ? c.filter(x => x !== d.v) : [...c, d.v].sort((a, b) => COURSES.indexOf(a) - COURSES.indexOf(b)); render(); },
  'idea-focus'(d) { ui.ideas.focus = d.v; render(); },
  'idea-hist'() { ui.ideas.useHistory = !ui.ideas.useHistory; render(); },
  async 'idea-go'() {
    const I = ui.ideas;
    if (!aiProvider() || I.loading) return;
    I.loading = true; I.error = ''; I.ctl = new AbortController(); render();
    try {
      const res = await aiJson(ideasPrompt(), I.ctl.signal);
      const arr = Array.isArray(res) ? res : (res && Array.isArray(res.ejercicios) ? res.ejercicios : []);
      const list = arr.filter(x => x && x.nombre).slice(0, 6).map(normIdea);
      if (list.length) { I.results = list; I.saved = {}; } else I.error = 'No han llegado ideas. Toca el botón otra vez.';
    } catch (e) { I.error = aiErr(e); }
    finally {
      I.loading = false; I.ctl = null; render();
      const r = document.getElementById('idea-results');
      if (r && I.results.length && !I.error && ui.exTab === 'ideas') r.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  },
  'idea-stop'() { if (ui.ideas.ctl) ui.ideas.ctl.abort(); },
  'idea-save'(d) { const x = ui.ideas.results[+d.i]; if (!x) return; const e = ideaToExercise(x); Store.save('exercises', e); ui.ideas.saved[+d.i] = e.id; render(); toast('Guardado en tus ejercicios'); },
  'idea-plan'(d) {
    const i = +d.i, x = ui.ideas.results[i]; if (!x) return;
    let id = ui.ideas.saved[i];
    if (!id || !S.exercises[id]) { const e = ideaToExercise(x); Store.save('exercises', e); ui.ideas.saved[i] = id = e.id; render(); }
    openSheet('addto', {exId: id});
  },

  /* Resumen */
  async 'sum-go'() {
    const P = ui.sum;
    if (!aiProvider() || P.loading) return;
    const data = summaryData();
    if (!data.count) { P.error = 'No hay entrenos hechos ni partidos en este periodo. Cambia el periodo o el grupo.'; render(); return; }
    P.loading = true; P.error = ''; P.ctl = new AbortController(); render();
    try {
      const res = await aiJson(summaryPrompt(data.text), P.ctl.signal);
      if (!res || typeof res !== 'object' || Array.isArray(res)) throw {code: 'invalid_json'};
      Store.save('meta', {id: 'summary', createdAt: Date.now(), label: progLabel(), data: normSummary(res)});
    } catch (e) { P.error = aiErr(e); }
    finally { P.loading = false; P.ctl = null; render(); }
  },
  'sum-stop'() { if (ui.sum.ctl) ui.sum.ctl.abort(); },

  backup() { doBackup(); },
  import() { const f = $('#import-file'); if (f) { f.value = ''; f.click(); } },
  seed() {
    let n = 0;
    SEED_EXERCISES.forEach(e => { if (!S.exercises[e.id]) { Store.save('exercises', Object.assign({videos: [], notes: '', source: 'inicio', createdAt: Date.now()}, clone(e))); n++; } });
    render(); toast(n ? `${plural(n, 'ejercicio añadido', 'ejercicios añadidos')}` : 'Ya tenías esos ejercicios');
  },
  'open-settings'() { openSheet('settings', {geminiKey: SET.geminiKey, geminiModel: SET.geminiModel || DEFAULT_MODEL, test: '', testing: false}); },
  async 'ai-test'() {
    if (F.testing) return;
    if (!String(F.geminiKey || '').trim()) { F.test = 'Pega primero tu clave de Gemini.'; renderSheet(); return; }
    F.testing = true; F.test = 'Probando…'; renderSheet();
    try { await geminiJson('Responde solo con este JSON: {"ok": true}', undefined, String(F.geminiKey).trim(), F.geminiModel); if (F) F.test = 'Conexión correcta: la IA está lista.'; }
    catch (e) { if (F) F.test = aiErr(e) || 'No se ha podido probar.'; }
    finally { if (F) { F.testing = false; renderSheet(); } }
  },
  'save-settings'() {
    SET.geminiKey = String(F.geminiKey || '').trim();
    SET.geminiModel = String(F.geminiModel || '').trim() || DEFAULT_MODEL;
    saveSettings(); closeSheet(); render(); toast(SET.geminiKey ? 'Ajustes de IA guardados' : 'Clave de Gemini borrada');
  },
};

/* ================= Eventos ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el);
});
function onForm(el, isChange) {
  const k = el.dataset.f;
  if (k === 'warmSel' || k === 'stretchSel') { if (el.value === '__keep') return; F[k === 'warmSel' ? 'warmup' : 'stretch'] = el.value ? snapRoutine(S.routines[el.value]) : null; renderSheet(); return; }
  if (k === 'step-name') { const st = F.steps[+el.dataset.i]; if (st) st.name = el.value; return; }
  if (k === 'step-min') { const st = F.steps[+el.dataset.i]; if (st) st.minutes = el.value === '' ? '' : clampInt(el.value, 0, 60); if (isChange) renderSheet(); return; }
  if (k === 'item-min') { const it = F.items[+el.dataset.i]; if (it) it.minutes = el.value === '' ? '' : clampInt(el.value, 0, 180); if (isChange) renderSheet(); return; }
  F[k] = el.value;
  if (k === 'pickQ' && !isChange) renderSheet();
  if (k === 'group' && isChange && (F.kind === 'session' || F.kind === 'match')) {
    if (!F.coachesTouched) F.coaches = coachIdsForGroup(String(el.value || '').trim());
    renderSheet();
  }
}
function onBind(el, isChange) {
  const k = el.dataset.bind, v = el.value;
  switch (k) {
    case 'item-note': { const s = sess(el.dataset.id); const it = s && s.items[+el.dataset.i]; if (!it) return; it.note = v.slice(0, 3000); Store.touch('sessions', s.id); break; }
    case 's-notes': { const s = sess(el.dataset.id); if (!s) return; s.notes = v.slice(0, 5000); Store.touch('sessions', s.id); break; }
    case 'm-good': case 'm-bad': { const m = mat(el.dataset.id); if (!m) return; m[k === 'm-good' ? 'good' : 'bad'] = v.slice(0, 5000); Store.touch('matches', m.id); break; }
    case 'score': { const m = mat(el.dataset.id); const x = m && m.sets[+el.dataset.i]; if (!x) return; x[el.dataset.side] = clampInt(v, 0, 99) || 0; Store.touch('matches', m.id); if (isChange) render(); break; }
    case 'pn-player': ui.pn.playerId = v; break;
    case 'pn-text': ui.pn.text = v; break;
    case 'ex-q': ui.exSearch = v; if (!isChange) render(); break;
    case 'pl-q': ui.plSearch = v; if (!isChange) render(); break;
    case 'idea-kids': ui.ideas.kids = v; break;
    case 'idea-min': ui.ideas.minutes = v; break;
    case 'idea-mat': ui.ideas.material = v; break;
    case 'idea-extra': ui.ideas.extra = v; break;
  }
}
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.f && F) onForm(el, false); else if (el.dataset && el.dataset.bind) onBind(el, false); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file') { if (el.files && el.files[0]) doImport(el.files[0]); return; }
  if (el.id === 'photo-file') {
    const file = el.files && el.files[0], id = ui.photoFor;
    if (!file || !id) return;
    photoFromFile(file).then(data => { const ex = S.exercises[id]; if (!ex) return; ex.photo = data; Store.save('exercises', ex); render(); toast('Foto guardada'); }).catch(() => toast('No se ha podido leer esa imagen. Prueba con otra foto.'));
    return;
  }
  if (el.dataset && el.dataset.f && F) onForm(el, true); else if (el.dataset && el.dataset.bind) onBind(el, true);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && F) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushAll(); });
window.addEventListener('pagehide', () => Store.flushAll());

/* ================= Arranque ================= */
render();
Store.init();
initCaps();
if (!inClaude()) {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
}
})();
</script>
</body>
</html>
